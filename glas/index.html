      const blobs = [[28, 176, 104, .52], [14, 140, 122, .40], [170, 255, 205, .17], [10, 110, 58, .58]];
      document.querySelectorAll('.aurora i.blob').forEach((el, i) => {
        const [r, gr, b, a] = blobs[i] || blobs[0];
        const c = makeCanvas(256, 256), g = c.getContext('2d');
        const rg = g.createRadialGradient(128, 128, 0, 128, 128, 128);
        rg.addColorStop(0, `rgba(${r},${gr},${b},${a})`);
        rg.addColorStop(1, `rgba(${r},${gr},${b},0)`);
        g.fillStyle = rg;
        g.fillRect(0, 0, 256, 256);
        const img = new Image();
        img.alt = '';
        img.className = el.className;
        img.src = c.toDataURL();
        el.replaceWith(img);
      });
    } catch (_) {}
  }

  // Volgorde telt: de eerste vier zijn genoeg voor een stilstaand, getapt glas (na draaien).
  const TEX_STEPS = [buildNoise, buildRuby, buildFoam, buildCoins, buildBand, buildCore];
  const TEX_STATIC = 4;
  let texKey = '', texStep = 0, texTimer = 0;
  function ensureTex(sync, staticOnly) {
    const key = W + 'x' + H + '@' + DPR;
    if (key !== texKey) { texKey = key; texStep = 0; }
    clearTimeout(texTimer);
    if (sync) {
      const upto = staticOnly ? TEX_STATIC : TEX_STEPS.length;
      while (texStep < upto) TEX_STEPS[texStep++]();
      if (texStep >= TEX_STEPS.length) return;
    }
    const run = () => {
      if (texStep >= TEX_STEPS.length) return;
      TEX_STEPS[texStep++]();
      texTimer = setTimeout(run, 24);
    };
    texTimer = setTimeout(run, sync ? 80 : 250);
  }

  // ---------- De stout: surge, cascade, opklaren van onderaf, schuimkraag, munten ----------
  // De echte ~2 minuten zijn samengeperst tot ~6 s; de bewegingen in het bier zelf houden (bijna) echte snelheid.
  const K = 1.1;                         // tijdschaal
  const T_FILL = .9 * K;
  const T_STREAM = .75 * K;
  const T_END = 5.4 * K;                 // daarna staat het bier stil (alleen nog munten)
  const T_COINS = 3.2 * K;
  const COIN_SPAN = 3.4;
  const G = 2400;                        // zwaartekracht, px/s²
  const NP = 420;                        // korrels en belletjes in de surge
  const PX = new Float32Array(NP), PY = new Float32Array(NP), PJ = new Float32Array(NP);
  const PT = new Uint8Array(NP), PB = new Uint8Array(NP);
  const NS = 24, SX = new Float32Array(NS + 1), SY = new Float32Array(NS + 1);
  const NH = 32, HX = new Float32Array(NH + 1), HT = new Float32Array(NH + 1), HB = new Float32Array(NH + 1);
  const head = { minTop: 0, maxBot: 0, meanBot: 0 };
  const NQ = 60, QX = new Float32Array(NQ), QY = new Float32Array(NQ), QV = new Float32Array(NQ);   // late belletjes in het heldere bier
  const FEATHER = [48, 36, 24, 12, 6];
  // surge-basiskleur: eerst romig (#7a5c45), dan naar cacao (#5b412f)
  const SURGE = Array.from({ length: 17 }, (_, i) => css([[122, 91], [92, 65], [69, 47]].map(([a, b]) => Math.round(a + (b - a) * i / 16))));

  function sizePourCanvases(on) {
    if (on) {
      liqCv.width = Math.round(W * LS);
      liqCv.height = Math.round(H * LS);
      fxCv.width = Math.round(W * FX);
      fxCv.height = Math.round(H * FX);
      // De hoop is nooit hoger dan 19% van het scherm (+ één munt): de pile-laag hoeft alleen dat stuk te beslaan.
      pileY0 = Math.max(0, Math.floor(H * .81 - 2.4 * (tex.coinR + tex.coinT + 3) - 8));
      pileCv.width = Math.round(W * FX);
      pileCv.height = Math.max(1, Math.round((H - pileY0) * FX));
      lctx.setTransform(liqCv.width / W, 0, 0, liqCv.height / H, 0, 0);
      fctx.setTransform(FX, 0, 0, FX, 0, 0);
    } else {
      [liqCv, fxCv, pileCv].forEach(c => { c.width = 1; c.height = 1; });
    }
    liqCv.hidden = fxCv.hidden = !on;
  }

  function makePour(at, instant) {
    sizePourCanvases(true);
    stage.classList.toggle('poured', !!instant);
    const r = tex.coinR;
    const n = Math.max(45, Math.min(80, Math.round(W * H / 5000)));
    const coins = [];
    for (let i = 0; i < n; i++) {
      coins.push({
        t0: T_COINS + (i / n) * COIN_SPAN + Math.random() * .2,
        x: W * (.08 + .84 * Math.random()),
        y: -r * 1.6 - Math.random() * 24,
        vy: Math.random() * 200,
        phi: Math.random() * TAU,
        w: (6 + 4 * Math.random()) * (Math.random() < .5 ? -1 : 1),
        rot: (Math.random() - .5) * .8,
        wr: (Math.random() - .5) * 6,
        wob: Math.random() * TAU,
        st: 0, bounced: false, wetY: 0, trail: 0, spark: -1,
      });
    }
    for (let i = 0; i < NP; i++) {
      const k = Math.random();
      PT[i] = k < .85 ? 0 : k < .97 ? 1 : 2;
      PB[i] = Math.random() < .5 ? 0 : 1;
      PJ[i] = (Math.random() - .5) * 16;
      PX[i] = Math.random() * W;
      PY[i] = -1;
    }
    for (let i = 0; i < NQ; i++) {
      QX[i] = Math.random() * W;
      QY[i] = -1;
      QV[i] = 25 + 35 * Math.random();
    }
    pileCtx.setTransform(1, 0, 0, 1, 0, 0);
    pileCtx.clearRect(0, 0, pileCv.width, pileCv.height);
    // het heldere bier: niet plat zwart, maar diepte van net onder de kraag naar de bodem
    const hb0 = headTopY() + headH();
    const body = lctx.createLinearGradient(0, hb0, 0, H);
    body.addColorStop(0, '#1a0f0a');
    body.addColorStop(.35, '#0b0605');
    body.addColorStop(1, '#050302');
    const p = {
      at, instant: !!instant, coins, heights: new Float32Array(Math.ceil(W / 3) + 2),
      drops: [], dents: [], trails: [], sparks: [], tops: [], shim: [], nextShimmer: 0,
      acc: 0, o1: 0, o2: 0, o3: 0, o4: 0, ob: 0, ob2: 0, oc: 0, og1: 0, og2: 0,
      liquidDone: false, fxStatic: false, poured: !!instant, shown: false, ready: false, body,
      q: { n: 0, sum: 0, done: false, low: false },
    };
    if (instant) coins.forEach(c => { c.st = 3; restCoin(p, c); });
    return p;
  }

  // Tijdlijn
  const levelAt = t => t >= T_FILL ? headTopY() : H - (H - headTopY()) * easeOutCubic(t / T_FILL);
  const sloshA = t => 10 * Math.exp(-3 * t / K);
  const headThick = t => t < T_FILL ? 16 + 14 * (t / T_FILL)
    : 30 + (headH() - 30) * easeOutQuad(clamp((t - T_FILL) / (4.4 * K - T_FILL)));
  const domeAt = t => t < 4.6 * K ? 0 : springAt(t - 4.6 * K, 0, 10, .4, .2);
  const cloudI = t => t < 1.6 * K ? 1 : 1 - .5 * smooth(1.6 * K, 4.4 * K, t);
  const churnAt = t => 1.6 - 1.2 * smooth(.6 * K, 3 * K, t);
  const bandV = t => t < 1.6 * K ? 150 + 110 * clamp(t / (1.6 * K)) : 260 - 150 * clamp((t - 1.6 * K) / (2.6 * K));
  const tanTint = t => .55 * (1 - smooth(1 * K, 4.2 * K, t));
  const rubyA = t => easeOutCubic(clamp((t - 3.4 * K) / (1.6 * K)));
  function cascadeI(t) {
    if (t < K) return 0;
    if (t < 1.6 * K) return (t - K) / (.6 * K);
    if (t < 3 * K) return 1 - .4 * (t - 1.6 * K) / (1.4 * K);
    return .6 * (1 - smooth(3.9 * K, 4.4 * K, t));
  }
  function headTopAt(x, t) {
    let y = levelAt(t) + sloshA(t) * Math.sin(TAU * 1.2 * x / W + 9 * t);
    if (t >= T_FILL) {
      const u = 2 * x / W - 1;
      y -= domeAt(t) * (1 - u * u);
      const e = Math.min(x, W - x);
      if (e < 6) y -= 3 * smooth(T_FILL, T_FILL + .6, t) * (1 - e / 6);   // schuim klimt tegen het glas
    }
    return y;
  }
  const headBotAt = (x, t) => levelAt(t) + headThick(t) + 3 * Math.sin(TAU * 1.5 * x / W + .8 * t)
    + sloshA(t) * .6 * Math.sin(TAU * 1.2 * x / W + 9 * t - .4);
  function frontAt(t) {
    if (t < 1.6 * K) return H + 80;
    const hb = levelAt(t) + headThick(t);
    return H + 60 - (H + 60 - hb) * easeInOutCubic(clamp((t - 1.6 * K) / (2.8 * K)));
  }

  // Tegels zelf leggen met drawImage (geen patronen, geen allocaties per frame).
  function tile(g, img, size, offX, offY, y0, y1, a, x0 = 0, x1 = W) {
    if (a <= .005 || !img) return;
    g.globalAlpha = a;
    const sx = x0 + ((((offX - x0) % size) + size) % size) - size;
    const sy = y0 + ((((offY - y0) % size) + size) % size) - size;
    for (let y = sy; y < y1; y += size) for (let x = sx; x < x1; x += size) g.drawImage(img, x, y, size, size);
  }
  function tileV(g, img, w, h, off, y0, y1, a) {
    if (a <= .005 || !img) return;
    g.globalAlpha = a;
    for (let y = y0 + ((((off - y0) % h) + h) % h) - h; y < y1; y += h) g.drawImage(img, 0, y, w, h);
  }

  // De straal uit de tap: wordt dunner naarmate hij valt, rond (robijnrode randen, donkere kern, één glanslijn).
  const streamX = t => W / 2 + 3 * Math.sin(t * 11);
  const streamW = y => 14 - 7 * clamp((y + 20) / (H + 20));
  function drawStream(g, t, lev) {
    if (t >= T_STREAM + .3) return;
    const topY = t < T_STREAM ? -20 : -20 + .5 * G * (t - T_STREAM) * (t - T_STREAM);
    const botY = lev + 6;
    if (topY >= botY) return;
    const cx = streamX(t), wT = streamW(topY), wB = streamW(botY);
    const lT = cx - wT / 2, lB = cx - wB / 2;
    const strip = (f0, f1) => {
      g.beginPath();
      g.moveTo(lT + f0 * wT, topY);
      g.lineTo(lT + f1 * wT, topY);
      g.lineTo(lB + f1 * wB, botY);
      g.lineTo(lB + f0 * wB, botY);
      g.closePath();
    };
    g.save();
    g.globalAlpha = .35;                           // zachte robijnrode zoom
    g.strokeStyle = 'rgb(110,28,16)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(lT - .5, topY); g.lineTo(lB - .5, botY);
    g.moveTo(lT + wT + .5, topY); g.lineTo(lB + wB + .5, botY);
    g.stroke();
    g.globalAlpha = 1;
    g.fillStyle = '#120806';
    strip(0, 1);
    g.fill();
    g.save();
    g.clip();
    tile(g, tex.light, 128, cx, 900 * t, topY, botY, .3);   // stroming in de straal
    g.restore();
    g.globalAlpha = 1;
    g.fillStyle = 'rgba(110,28,16,.85)';
    strip(0, .15); g.fill();
    strip(.85, 1); g.fill();
    g.fillStyle = 'rgba(110,28,16,.35)';
    strip(.15, .24); g.fill();
    strip(.76, .85); g.fill();
    g.fillStyle = 'rgba(255,240,220,.5)';
    strip(.25, .39); g.fill();
    g.restore();
  }

  function drawParticles(g, p, t, dt, hb, yf, vB, a) {
    if (yf - hb < 8) return;
    const live = Math.round((p.q.low ? 220 : NP) * a);
    for (let i = 0; i < live; i++) {
      let x = PX[i], y = PY[i];
      if (y < hb || y > yf) {
        x = Math.random() * W;
        y = hb + Math.random() * (yf - hb);
      } else if (PT[i] === 2) {
        y -= (40 + 2 * (i % 11)) * dt;
      } else {
        const e = smooth(.55, .95, Math.abs(2 * x / W - 1));
        y += (1.1 * vB * e - 55 * (1 - e)) * dt;            // langs het glas omlaag, in het midden omhoog
        x += (12 * Math.sin(y / 90 + 1.3 * t) + PJ[i]) * dt;
        if (x < 0) x += W; else if (x > W) x -= W;
      }
      PX[i] = x;
      PY[i] = y;
    }
    const fa = Math.min(1, a * 1.4);
    g.fillStyle = '#b39274';
    g.globalAlpha = .28 * fa;
    for (let i = 0; i < live; i++) if (PT[i] === 0 && PB[i] === 0) g.fillRect(PX[i], PY[i], .8, .8);
    g.globalAlpha = .46 * fa;
    for (let i = 0; i < live; i++) if (PT[i] === 0 && PB[i] === 1) g.fillRect(PX[i], PY[i], .8, .8);
    g.fillStyle = '#cdb08f';
    g.globalAlpha = .5 * fa;
    for (let i = 0; i < live; i++) if (PT[i] === 1) g.fillRect(PX[i], PY[i], 1.6, 1.6);
    if (tex.bub) {
      g.globalAlpha = .8 * fa;
      for (let i = 0; i < live; i++) if (PT[i] === 2) g.drawImage(tex.bub, PX[i] - 2.2, PY[i] - 2.2, 4.4, 4.4);
    }
  }

  function frontPath(g, front, t, lift) {
    const arch = .03 * H;
    g.beginPath();
    for (let i = 0; i <= NS; i++) {
      const x = i * W / NS, u = 2 * x / W - 1;
      const y = front - lift - arch * (1 - u * u) + 7 * Math.sin(TAU * 2.3 * x / W + 1.7 * t) + 4 * Math.sin(TAU * 5.1 * x / W - 2.9 * t);
      if (i) g.lineTo(x, y); else g.moveTo(x, y);
    }
  }

  function drawLiquid(p, t, dt) {
    const g = lctx;
    g.globalAlpha = 1;
    g.clearRect(0, 0, W, H);
    const lev = levelAt(t);
    for (let i = 0; i <= NS; i++) { SX[i] = i * W / NS; SY[i] = headTopAt(SX[i], t) + 2; }
    drawStream(g, t, lev);
    const top = Math.max(0, lev - sloshA(t) - 14);
    const hb = lev + headThick(t);
    const front = frontAt(t);
    const yLow = Math.min(H, front + 40);

    g.save();
    g.beginPath();
    g.moveTo(SX[0], SY[0]);
    for (let i = 1; i <= NS; i++) g.lineTo(SX[i], SY[i]);
    g.lineTo(W, H + 2);
    g.lineTo(0, H + 2);
    g.closePath();
    g.clip();
    g.fillStyle = p.body;
    g.fillRect(0, top, W, H - top);

    const Ic = cloudI(t), ch = churnAt(t), Icas = cascadeI(t), vB = bandV(t);
    p.o1 -= 70 * ch * dt; p.o2 += 35 * ch * dt; p.o3 += 20 * dt; p.o4 -= 90 * dt;
    p.ob += vB * dt; p.ob2 += .75 * vB * dt; p.oc -= 45 * dt;
    p.og1 += 1.1 * vB * dt; p.og2 -= 55 * dt;
    if (yLow > top) {
      // de surge: eerst romig latte, dan cacao; kolkend (dezelfde ruis op verschillende schalen, tegengesteld)
      g.globalAlpha = .8 * Ic;
      g.fillStyle = SURGE[Math.round(16 * clamp((t - 1.2 * K) / (.8 * K)))];
      g.fillRect(0, top, W, yLow - top);
      // de wolken bollen op en draaien een fractie (geen behang dat verschuift)
      const mx = W / 2, my = (top + yLow) / 2, m = .06 * Math.max(W, H);
      for (let i = 0; i < 2; i++) {
        g.save();
        g.translate(mx, my);
        g.rotate((i ? -.04 : .04) * Math.sin(i ? .9 * t + 1 : t));
        const sc = 1 + .03 * Math.sin(1.3 * t + i * 2);
        g.scale(sc, sc);
        g.translate(-mx, -my);
        if (i) tile(g, tex.light, 410, -8 * Math.sin(1.1 * t + 1), p.o2, top - m, yLow + m, .5 * Ic, -m, W + m);
        else tile(g, tex.light, 768, 12 * Math.sin(.7 * t), p.o1, top - m, yLow + m, .75 * Ic, -m, W + m);
        g.restore();
      }
      tile(g, tex.dark, 563, p.o3, p.o3 * .3, top, yLow, .35 * Ic);
      if (!p.q.low) {
        const surge = smooth(.3 * K, .5 * K, t) * (1 - smooth(1.4 * K, 1.8 * K, t));
        tile(g, tex.peak, 666, 0, p.o4, top, yLow, .25 * surge);
      }
      // bubbelkorrel: langs het glas omlaag, in het midden omhoog
      const ga = .5 * Ic;
      if (ga > .01 && tex.grain) {
        g.save();
        g.beginPath();
        g.rect(0, top, W * .18, yLow - top);
        g.rect(W * .82, top, W * .18, yLow - top);
        g.clip();
        tile(g, tex.grain, 256, 0, p.og1, top, yLow, ga);
        g.restore();
        g.save();
        g.beginPath();
        g.rect(W * .18, top, W * .64, yLow - top);
        g.clip();
        tile(g, tex.grain, 256, 97, p.og2, top, yLow, ga);
        g.restore();
      }
      // de cascade: slierten die langs het glas omlaag rollen (oplichten, niet overschilderen)
      if (Icas > .01 && tex.band) {
        const bh = 512 / LS;
        g.save();
        g.globalCompositeOperation = 'screen';
        tileV(g, tex.band, W, bh, p.ob, top, yLow, .55 * Icas);
        if (!p.q.low) {
          g.translate(W, 0);
          g.scale(-1, 1);
          tileV(g, tex.band, W, bh * .6, p.ob2, top, yLow, .25 * Icas);
        }
        g.restore();
      }
      tileV(g, tex.core, W, tex.coreH, p.oc, top, yLow, .18 * Ic);
      drawParticles(g, p, t, dt, hb, Math.min(front, H), vB, Ic);
    }
    // inslag van de straal
    const ik = 1 - smooth(T_STREAM - .1, T_STREAM + .25, t);
    if (ik > 0 && tex.churn) {
      const cy = lev + 70;
      for (let i = 0; i < 2; i++) {
        g.save();
        g.translate(W / 2 + (i ? -14 : 10), cy + (i ? 20 : 0));
        g.rotate(t * (i ? -2.6 : 3.4) + i);
        g.globalAlpha = (i ? .55 : .8) * ik;
        g.drawImage(tex.churn, -130, -130, 260, 260);
        g.restore();
      }
    }
    // overal stijgen de belletjes eruit: het bier wordt donkerder
    const fp = clamp((t - 1.6 * K) / (2.8 * K));
    if (fp > 0) {
      g.globalAlpha = .32 * fp;
      g.fillStyle = '#0a0605';
      g.fillRect(0, top, W, Math.min(front, H) - top);
    }
    // het opklaarfront van onderaf: midden voorop, randen blijven achter; zachte, vervloeiende overgang
    if (front < H + 40) {
      g.fillStyle = p.body;
      g.globalAlpha = .16;
      for (let i = 0; i < FEATHER.length; i++) {
        frontPath(g, front, t, FEATHER[i]);
        g.lineTo(W, H + 2);
        g.lineTo(0, H + 2);
        g.closePath();
        g.fill();
      }
      g.globalAlpha = 1;
      frontPath(g, front, t, 0);
      g.lineTo(W, H + 2);
      g.lineTo(0, H + 2);
      g.closePath();
      g.fill();
      if (front < H) {
        // in het heldere bier blijft het nog even leven: cascade langs het glas, een paar late belletjes
        const wa = .12 * smooth(1.6 * K, 2.1 * K, t) * (1 - smooth(4.4 * K, T_END - .05, t));
        if (wa > .005 && tex.band) {
          g.save();
          g.beginPath();
          g.rect(0, front, W * .1, H - front);
          g.rect(W * .9, front, W * .1, H - front);
          g.clip();
          g.globalCompositeOperation = 'screen';
          tileV(g, tex.band, W, 512 / LS, p.ob, front, H, wa);
          g.restore();
        }
        const qa = .12 * (1 - smooth(T_END - .6, T_END, t));
        if (qa > .005) {
          g.globalAlpha = qa;
          g.fillStyle = '#c9a888';
          for (let i = 0; i < NQ; i++) {
            let y = QY[i] - QV[i] * dt;
            if (y < front || y > H) { y = front + Math.random() * (H - front); QX[i] = Math.random() * W; }
            QY[i] = y;
            g.fillRect(QX[i], y, 1.3, 1.3);
          }
        }
      }
    }
    const wk = (t - 4.2 * K) / (.5 * K);
    if (wk > 0 && wk < 1) {
      g.globalAlpha = .35 * (1 - wk);
      g.fillStyle = '#8a6a52';
      g.fillRect(0, hb - 2, W, 12);
    }
    const ra = rubyA(t);
    if (ra > 0 && tex.ruby) {
      g.globalAlpha = ra;
      g.drawImage(tex.ruby, 0, 0, W, H);
    }
    g.globalAlpha = 1;
    g.restore();
  }

  function computeHead(t) {
    let mnT = Infinity, mxB = -Infinity, sB = 0;
    for (let i = 0; i <= NH; i++) {
      const x = i * W / NH;
      HX[i] = x;
      HT[i] = headTopAt(x, t);
      HB[i] = headBotAt(x, t);
      if (HT[i] < mnT) mnT = HT[i];
      if (HB[i] > mxB) mxB = HB[i];
      sB += HB[i];
    }
    head.minTop = mnT;
    head.maxBot = mxB;
    head.meanBot = sB / (NH + 1);
  }

  function curve(g, Y, dy, from) {
    if (from) g.moveTo(HX[0], Y[0] + dy); else g.lineTo(HX[0], Y[0] + dy);
    for (let i = 1; i <= NH; i++) g.lineTo(HX[i], Y[i] + dy);
  }
  function curveBack(g, Y, dy) {
    for (let i = NH; i >= 0; i--) g.lineTo(HX[i], Y[i] + dy);
  }

  // De schuimkraag: dicht, romig, fijne belletjes; eerst zandkleurig, dan roomwit; licht bolletje op het eind.
  function drawHead(g, t) {
    // Zodra het glas vol is loopt het schuim door tot boven de schermrand (ook achter statusbalk en Dynamic Island):
    // geen groene streep meer bovenin. De kromme HT blijft het oppervlak (meniscus, waar munten inslaan).
    const ext = smooth(T_FILL * .8, T_FILL + .25, t);
    const yA = head.minTop - ext * (head.minTop + 20) - 6, hgt = head.maxBot - yA + 6;
    g.save();
    g.beginPath();
    if (ext > 0) {
      g.moveTo(HX[0], HT[0] - ext * (HT[0] + 20));
      for (let i = 1; i <= NH; i++) g.lineTo(HX[i], HT[i] - ext * (HT[i] + 20));
    } else curve(g, HT, 0, true);
    curveBack(g, HB, 0);
    g.closePath();
    g.clip();
    g.globalAlpha = 1;
    g.fillStyle = '#ede2cc';
    g.fillRect(0, yA, W, hgt);
    if (tex.foam) {
      g.setTransform(1, 0, 0, 1, 0, 0);
      const dy = Math.floor(yA * FX);
      for (let x = 0; x < fxCv.width; x += tex.foam.width) g.drawImage(tex.foam, x, dy);
      g.setTransform(FX, 0, 0, FX, 0, 0);
    }
    if (ext > 0) {
      // het bovenvlak van de kraag (achter de meniscus): iets lichter, van boven belicht
      g.globalAlpha = .18 * ext;
      g.fillStyle = '#fffcf4';
      g.beginPath();
      g.moveTo(0, yA);
      g.lineTo(W, yA);
      curveBack(g, HT, 0);
      g.closePath();
      g.fill();
      g.globalAlpha = 1;
    }
    const tt = tanTint(t);
    if (tt > .01) {
      g.globalAlpha = tt;
      g.fillStyle = '#b8936e';
      g.fillRect(0, yA, W, hgt);
      g.globalAlpha = 1;
    }
    const wb = g.createLinearGradient(0, head.meanBot - 26, 0, head.meanBot + 3);
    wb.addColorStop(0, 'rgba(214,196,166,0)');
    wb.addColorStop(1, 'rgba(196,172,136,.92)');
    g.fillStyle = wb;
    g.fillRect(0, head.meanBot - 26, W, 36);
    // schaduwlintje onder de lip, langs het glas
    g.fillStyle = 'rgba(179,156,126,.35)';
    g.fillRect(0, yA, 3, hgt);
    g.fillRect(W - 3, yA, 3, hgt);
    g.restore();

    // overgang schuim → bier
    const thick = 16 + 14 * (tt / .55);
    g.beginPath();
    curve(g, HB, -1, true);
    curveBack(g, HB, thick);
    g.closePath();
    const ig = g.createLinearGradient(0, head.meanBot - 1, 0, head.meanBot + thick);
    ig.addColorStop(0, 'rgba(164,133,102,.95)');
    ig.addColorStop(.35, 'rgba(94,67,50,.7)');
    ig.addColorStop(1, 'rgba(40,24,16,0)');
    g.fillStyle = ig;
    g.fill();
    g.lineJoin = 'round';
    g.beginPath();
    curve(g, HB, 0, true);
    g.strokeStyle = 'rgba(255,255,255,.22)';
    g.lineWidth = 1;
    g.stroke();
    // meniscus bovenop
    const hl = t < 4.6 * K ? .4 : .4 + .35 * smooth(4.6 * K, 5.2 * K, t);
    g.beginPath();
    curve(g, HT, .6, true);
    g.strokeStyle = `rgba(255,253,247,${hl})`;
    g.lineWidth = 1.5;
    g.stroke();
  }

  const frameOf = phi => ((Math.round(phi / TAU * 24) % 24) + 24) % 24;

  function drawCoin(g, c, a, wet) {
    const f = frameOf(c.phi), cell = tex.coinCell, cs = cell / FX;
    const co = Math.cos(c.rot) * FX, si = Math.sin(c.rot) * FX;
    g.setTransform(co, si, -si, co, c.x * FX, c.y * FX);
    if (wet > 0) {
      g.globalAlpha = a;
      g.drawImage(tex.coins, f * cell, cell, cell, cell, -cs / 2, -cs / 2, cs, cs);
    }
    if (wet < 1) {
      g.globalAlpha = a * (1 - wet);
      g.drawImage(tex.coins, f * cell, 0, cell, cell, -cs / 2, -cs / 2, cs, cs);
    }
    g.globalAlpha = 1;
    g.setTransform(FX, 0, 0, FX, 0, 0);
  }

  function footprint(p, x, half) {
    const b0 = Math.max(0, Math.floor((x - half) / 3)), b1 = Math.min(p.heights.length - 1, Math.ceil((x + half) / 3));
    const mid = Math.floor(x / 3);
    let mx = 0, hl = 0, nl = 0, hr = 0, nr = 0;
    for (let b = b0; b <= b1; b++) {
      const h = p.heights[b];
      if (h > mx) mx = h;
      if (b <= mid) { hl += h; nl++; } else { hr += h; nr++; }
    }
    return [nl ? hl / nl : 0, nr ? hr / nr : 0, mx, b0, b1];
  }

  // Munt komt tot rust op de hoop: liggend of schuin, helling volgt de hoop, wordt in de stapel 'gestempeld'.
  function restCoin(p, c) {
    const r = tex.coinR, T = tex.coinT, half = .9 * r;
    const ri = Math.random() < .7 ? randFast(5) : 5 + randFast(3);
    const phi = REST_DEG[ri] * Math.PI / 180;
    let x = Math.max(r, Math.min(W - r, c.x));
    let fp = footprint(p, x, half);
    let slope = (fp[0] - fp[1]) / (1.8 * r);
    if (Math.abs(slope) > .35) {
      x = Math.max(r, Math.min(W - r, x + Math.sign(slope) * .5 * r));   // glijdt een stukje naar beneden
      fp = footprint(p, x, half);
      slope = (fp[0] - fp[1]) / (1.8 * r);
    }
    const ang = Math.max(-.35, Math.min(.35, Math.atan(slope)));
    const ry = r * Math.cos(phi), d = T * Math.sin(phi);
    const base = fp[2];
    const cy = H - base - ry - d / 2 + 1.5;
    // stempelen: schaduw, dan de munt
    const g = pileCtx, cell = tex.coinCell, cs = cell / FX;
    g.setTransform(FX, 0, 0, FX, 0, -pileY0 * FX);
    g.globalAlpha = .6;
    g.drawImage(tex.coinShadow, x - 1.15 * r, cy + ry + d / 2 - .3 * r, 2.3 * r, .7 * r);
    g.globalAlpha = 1;
    const co = Math.cos(ang) * FX, si = Math.sin(ang) * FX;
    g.setTransform(co, si, -si, co, x * FX, (cy - pileY0) * FX);
    g.drawImage(tex.coins, ri * cell, cell * 2, cell, cell, -cs / 2, -cs / 2, cs, cs);
    g.setTransform(1, 0, 0, 1, 0, 0);
    const add = (2 * ry + d) * .5;
    const cap = H * .19;
    for (let b = fp[3]; b <= fp[4]; b++) {
      const dx = (b * 3 + 1.5 - x) / half;
      const prof = Math.sqrt(Math.max(0, 1 - dx * dx));
      p.heights[b] = Math.min(cap, Math.max(p.heights[b], base + add * (.3 + .7 * prof)));
    }
    p.tops.push({ x: x - .3 * r, y: cy - ry * .6 });
    if (p.tops.length > 60) p.tops.shift();
    c.st = 4;
  }
  const randFast = n => Math.floor(Math.random() * n);   // alleen voor decor, niet voor de uitslag

  function splash(p, x, y, t) {
    for (let i = 0; i < 8 && p.drops.length < 120; i++) {
      const a = -Math.PI / 2 + (Math.random() * 2 - 1) * 55 * Math.PI / 180;
      const s = 220 + 260 * Math.random();
      p.drops.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 1.5 + 2 * Math.random(), t0: t });
    }
    if (p.dents.length < 30) p.dents.push({ x, y, t0: t });
  }

  function stepCoins(p, t, h) {
    const r = tex.coinR, T = tex.coinT;
    for (let i = 0; i < p.coins.length; i++) {
      const c = p.coins[i];
      if (c.st === 0) { if (t >= c.t0) c.st = 1; else continue; }
      if (c.st >= 4) continue;
      if (c.st === 1) {                                   // lucht
        c.vy += G * h;
        c.y += c.vy * h;
        c.phi += c.w * h;
        c.rot += c.wr * h;
        const top = headTopAt(c.x, t);
        if (c.y + r * .3 >= top) { c.st = 2; c.vy *= .35; splash(p, c.x, top, t); }
      } else if (c.st === 2) {                            // door het schuim
        c.vy = c.vy * Math.exp(-7 * h) + G * h;
        c.y += c.vy * h;
        c.phi += c.w * .5 * h;
        c.rot += c.wr * .3 * h;
        if (c.y >= headBotAt(c.x, t)) { c.st = 3; c.wetY = c.y; }
      } else {                                            // zakt door de stout, dwarrelt als een blaadje
        c.vy += (420 - c.vy) * (1 - Math.exp(-4 * h));
        c.y += c.vy * h;
        c.w += ((c.w < 0 ? -2 : 2) - c.w) * (1 - Math.exp(-2 * h));
        c.phi += c.w * h;
        c.rot *= Math.exp(-1.5 * h);
        c.wob += 7 * h;
        c.x = Math.max(r, Math.min(W - r, c.x + 70 * Math.cos(c.wob) * h));
        c.trail += h;
        if (c.trail > .05) {
          c.trail = 0;
          if (p.trails.length < 90) p.trails.push({ x: c.x + (Math.random() - .5) * r, y: c.y - r * .3, t0: t });
        }
        if (Math.cos(c.phi - .5) > .97 && t - c.spark > .3 && p.sparks.length < 40) {
          c.spark = t;
          p.sparks.push({ x: c.x - .45 * r, y: c.y - .3 * r * Math.abs(Math.cos(c.phi)), t0: t, s: .6 + .4 * Math.random() });
        }
        const fp = footprint(p, c.x, .9 * r);
        const ground = H - fp[2];
        const bottom = c.y + r * Math.abs(Math.cos(c.phi)) * .9 + T * .5;
        if (bottom >= ground) {
          if (!c.bounced) { c.bounced = true; c.vy = -.25 * c.vy; c.y -= bottom - ground; }
          else restCoin(p, c);
        }
      }
    }
  }

  function stepPour(p, t, dt) {
    p.acc += dt;
    const h = 1 / 120;
    let n = 0;
    while (p.acc >= h && n < 30) { stepCoins(p, t, h); p.acc -= h; n++; }
    if (n >= 30) p.acc = 0;
    for (let i = 0; i < p.drops.length; i++) {
      const d = p.drops[i];
      d.vy += G * dt;
      d.x += d.vx * dt;
      d.y += d.vy * dt;
    }
    p.drops = p.drops.filter(d => t - d.t0 < .45);
    p.dents = p.dents.filter(d => t - d.t0 < .7);
    p.trails = p.trails.filter(d => t - d.t0 < .6);
    p.sparks = p.sparks.filter(d => t - d.t0 < .25);
  }

  function drawFx(p, t) {
    const g = fctx, th = Math.min(t, T_END), r = tex.coinR;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.clearRect(0, 0, fxCv.width, fxCv.height);
    if (p.tops.length) g.drawImage(pileCv, 0, Math.round(pileY0 * FX));   // lege hoop niet elk frame kopiëren
    g.setTransform(FX, 0, 0, FX, 0, 0);
    computeHead(th);
    // munten in het bier (onder de kraag)
    for (let i = 0; i < p.coins.length; i++) {
      const c = p.coins[i];
      if (c.st === 3) drawCoin(g, c, 1, clamp((c.y - c.wetY) / 60));
    }
    if (p.trails.length && tex.dot) {
      for (let i = 0; i < p.trails.length; i++) {
        const d = p.trails[i], k = (t - d.t0) / .6;
        g.globalAlpha = .55 * (1 - k);
        g.drawImage(tex.dot, d.x - 1.2, d.y - 60 * (t - d.t0) - 1.2, 2.4, 2.4);
      }
      g.globalAlpha = 1;
    }
    drawHead(g, th);
    // waar de straal de kraag in gaat: een donker kuiltje en een roomkringetje
    const sa = 1 - smooth(T_STREAM, T_STREAM + .2, t);
    if (sa > 0 && !p.instant) {
      const sx = streamX(t), sy = headTopAt(sx, th), sw = streamW(sy);
      g.globalAlpha = .55 * sa;
      g.fillStyle = 'rgb(58,36,24)';
      g.beginPath();
      g.ellipse(sx, sy + 2.5, sw * .95, 3.2, 0, 0, TAU);
      g.fill();
      const ph = (t * 7) % 1;
      g.globalAlpha = .6 * sa * (1 - ph);
      g.strokeStyle = '#fffaf0';
      g.lineWidth = 1.4;
      g.beginPath();
      g.ellipse(sx, sy + 2, sw * .9 + 2 + 10 * ph, 2.6 + 2.2 * ph, 0, 0, TAU);
      g.stroke();
      g.globalAlpha = 1;
    }
    // deukjes en rimpels in het schuim waar een munt erin plonst
    for (let i = 0; i < p.dents.length; i++) {
      const d = p.dents[i], k = (t - d.t0) / .7;
      g.globalAlpha = .35 * (1 - k);
      g.fillStyle = 'rgb(110,85,62)';
      g.beginPath();
      g.ellipse(d.x, d.y + 3, 1.6 * r * (1 - .5 * k) / 2 + .1, .5 * r * (1 - k) / 2 + .1, 0, 0, TAU);
      g.fill();
      const k4 = (t - d.t0) / .4;
      if (k4 < 1) {
        g.globalAlpha = .4 * (1 - k4);
        g.strokeStyle = 'rgba(255,252,242,1)';
        g.lineWidth = 1.2;
        g.beginPath();
        g.ellipse(d.x, d.y + 3, 3 * r * k4 + .1, r * k4 * .7 + .1, 0, 0, TAU);
        g.stroke();
      }
    }
    g.globalAlpha = 1;
    // munten in de lucht en in het schuim (zakken zichtbaar weg in de room)
    for (let i = 0; i < p.coins.length; i++) {
      const c = p.coins[i];
      if (c.st === 1) drawCoin(g, c, 1, 0);
      else if (c.st === 2) {
        const tp = headTopAt(c.x, th), bt = headBotAt(c.x, th);
        drawCoin(g, c, 1 - .7 * clamp((c.y - tp) / Math.max(1, bt - tp)), 0);
      }
    }
    if (tex.dot) {
      for (let i = 0; i < p.drops.length; i++) {
        const d = p.drops[i], k = (t - d.t0) / .45;
        g.globalAlpha = 1 - k;
        g.drawImage(tex.dot, d.x - d.r, d.y - d.r, 2 * d.r, 2 * d.r);
      }
    }
    if (p.sparks.length && tex.sparkle) {
      g.globalCompositeOperation = 'lighter';
      for (let i = 0; i < p.sparks.length; i++) {
        const s = p.sparks[i], k = (t - s.t0) / .25;
        const sz = 22 * s.s * Math.sin(Math.PI * k);
        g.globalAlpha = .9 * (1 - k * k);
        g.drawImage(tex.sparkle, s.x - sz / 2, s.y - sz / 2, sz, sz);
      }
      g.globalCompositeOperation = 'source-over';
    }
    g.globalAlpha = 1;
  }

  function pourSettled(p) {
    if (p.drops.length || p.dents.length || p.trails.length || p.sparks.length) return false;
    for (let i = 0; i < p.coins.length; i++) if (p.coins[i].st < 4) return false;
    return true;
  }

  function renderPour(now, elapsed) {
    const p = pour;
    const t = p.instant ? 99 : (now - p.at) / 1000;
    const dt = Math.min(.05, Math.max(0, elapsed));
    if (!p.instant && !p.q.done) {          // te traag? dan lichtere versie
      p.q.n++;
      if (p.q.n > 10) p.q.sum += elapsed;
      if (p.q.n >= 40) { p.q.done = true; if (p.q.sum / 30 > .018) p.q.low = true; }
    }
    if (!p.poured && t > 1.4 * K) { p.poured = true; stage.classList.add('poured'); }
    if (!p.shown && t >= 3.3 * K) { p.shown = true; reveal.classList.add('show'); }    // front halverwege: tekst
    if (!p.ready && t >= 4.8 * K) { p.ready = true; reveal.classList.add('ready'); }   // bier staat: "opnieuw"
    if (!p.liquidDone) {
      drawLiquid(p, Math.min(t, T_END), dt);
      if (t >= T_END) p.liquidDone = true;   // daarna blijft het laatste beeld gewoon staan
    }
    if (!p.instant) stepPour(p, t, dt);
    if (!p.fxStatic) {
      drawFx(p, t);
      if (t >= T_END && pourSettled(p)) p.fxStatic = true;
    }
  }

  // Na het tappen: af en toe een fonkeling op de muntenhoop.
  function drawShimmer(now) {
    const p = pour;
    if (!p || reduced || !p.tops.length || !tex.sparkle) return;
    if (!p.instant && (now - p.at) / 1000 < T_END) return;
    if (now >= p.nextShimmer) {
      p.nextShimmer = now + 280 + Math.random() * 380;
      const tp = p.tops[randFast(p.tops.length)];
      p.shim.push({ x: tp.x, y: tp.y, t0: now });
    }
    p.shim = p.shim.filter(s => now - s.t0 < 350);
    if (!p.shim.length) return;
    ctx.globalCompositeOperation = 'lighter';
    p.shim.forEach(s => {
      const k = (now - s.t0) / 350;
      const sz = 20 * easeOutBack(Math.min(1, k * 2)) * (1 - k * .5);
      ctx.globalAlpha = .9 * (1 - k * k);
      ctx.drawImage(tex.sparkle, s.x - sz / 2, s.y - sz / 2, sz, sz);
    });
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  // ---------- Markers: glanzend klavertje met glazen nummerschijfje ----------
  const fontCache = new Map();
  const numFont = px => {
    const k = Math.max(1, Math.round(px));
    let f = fontCache.get(k);
    if (!f) {
      f = `700 ${k}px ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif`;
      fontCache.set(k, f);
    }
    return f;
  };
  const discRim = ctx.createLinearGradient(0, -1, 0, 1);
  discRim.addColorStop(0, 'rgba(255,255,255,.9)');
  discRim.addColorStop(.45, 'rgba(255,255,255,.16)');
  discRim.addColorStop(.8, 'rgba(255,255,255,.06)');
  discRim.addColorStop(1, 'rgba(255,255,255,.4)');

  // label = spelernummer in het hart van het klavertje; ring = teamring (0..1)
  function clover(x, y, paint, s, a, label, rot, ring) {
    if (a <= 0 || s <= 0) return;
    const rad = R * s;
    ctx.save();
    ctx.globalAlpha = a;
    if (tex.cloverShadow) ctx.drawImage(tex.cloverShadow, x - rad * 1.55, y - rad * 1.55 + rad * .22, rad * 3.1, rad * 3.1);
    if (ring) {
      const rr = rad * 1.36;
      ctx.globalAlpha = a * ring;
      ctx.lineWidth = 8.5;
      ctx.strokeStyle = 'rgba(0,10,5,.45)';
      ctx.beginPath(); ctx.arc(x, y, rr, 0, TAU); ctx.stroke();
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = paint.hex;
      ctx.stroke();
      ctx.lineWidth = 1.1;
      ctx.strokeStyle = 'rgba(255,255,255,.6)';
      ctx.beginPath(); ctx.arc(x, y, rr - .9, Math.PI * 1.05, Math.PI * 1.75); ctx.stroke();
      ctx.globalAlpha = a;
    }
    ctx.translate(x, y);
    ctx.save();
    ctx.rotate(rot || 0);
    // steeltje
    ctx.strokeStyle = paint.dark;
    ctx.lineWidth = rad * .1;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, rad * .2);
    ctx.quadraticCurveTo(rad * .02, rad * .85, rad * .3, rad * 1.3);
    ctx.stroke();
    if (!paint.grad) {
      paint.grad = ctx.createRadialGradient(-.12, -.8, .02, 0, -.5, .82);
      paint.grad.addColorStop(0, paint.light);
      paint.grad.addColorStop(.5, paint.hex);
      paint.grad.addColorStop(1, paint.dark);
    }
    const len = rad * 1.08;
    for (let i = 0; i < 4; i++) {
      ctx.save();
      ctx.rotate(Math.PI / 4 + i * Math.PI / 2);
      ctx.scale(len, len);
      ctx.fillStyle = paint.grad;
      ctx.fill(LEAF);
      ctx.strokeStyle = paint.deep;
      ctx.lineWidth = .028;
      ctx.stroke(LEAF);
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      ctx.fill(LEAF_HI);
      ctx.globalAlpha = a * .45;                 // nerf
      ctx.strokeStyle = paint.light;
      ctx.lineWidth = .025;
      ctx.beginPath(); ctx.moveTo(0, -.24); ctx.lineTo(0, -.7); ctx.stroke();
      ctx.globalAlpha = a;
      ctx.restore();
    }
    ctx.restore();

    // glazen schijfje met het nummer, altijd rechtop
    const dr = rad * .47;
    ctx.save();
    ctx.scale(dr, dr);
    ctx.fillStyle = 'rgba(3,20,11,.76)';
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.beginPath(); ctx.ellipse(0, -.43, .72, .42, 0, 0, TAU); ctx.fill();
    ctx.lineWidth = .085;
    ctx.strokeStyle = discRim;
    ctx.beginPath(); ctx.arc(0, 0, .955, 0, TAU); ctx.stroke();
    ctx.restore();
    if (label != null) {
      ctx.fillStyle = '#fff';
      ctx.font = numFont(rad * (label > 9 ? .48 : .6));
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(label), 0, rad * .03);
    }
    ctx.restore();
  }

  // Aftelring in Apple-stijl: donkere halo, glazen spoor, witte voortgang.
  function countdown(x, y, rad, p) {
    ctx.lineCap = 'round';
    ctx.lineWidth = 7.5;
    ctx.strokeStyle = 'rgba(0,14,8,.35)';
    ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.stroke();
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = 'rgba(255,255,255,.2)';
    ctx.stroke();
    ctx.strokeStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, y, rad, -Math.PI / 2, -Math.PI / 2 + TAU * p); ctx.stroke();
    ctx.lineCap = 'butt';
  }

  function winnerClover(now) {
    const age = now - winner.at;
    const { x, y } = winner;
    if (!reduced) {
      ctx.strokeStyle = '#ffe7a3';
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const p = (age / 1800 + i / 3) % 1;
        ctx.globalAlpha = (1 - p) * (1 - p) * .5;      // korter en sneller weg: niet door de tekst heen
        ctx.beginPath(); ctx.arc(x, y, R * (1.4 + p * 1.7), 0, TAU); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    const pop = reduced ? 1 : easeOutBack(clamp(age / 420));
    const pulse = reduced ? 1 : 1 + .05 * Math.sin(age / 200);
    const sway = reduced ? 0 : .07 * Math.sin(age / 520);
    clover(x, y, GOLD, (.9 + .25 * pop) * pulse, 1, winner.num, winner.rot + sway, 1);
  }

  // ---------- Teams: zachte gebieden, duidelijke lijnen, gekleurde ringen ----------
  // Kortste verbindingen tussen teamgenoten (minimale opspannende boom): geen kruisende lijnen binnen een team.
  function mstEdges(g) {
    const n = g.length, used = new Array(n).fill(false), edges = [];
    used[0] = true;
    for (let k = 1; k < n; k++) {
      let best = Infinity, a = -1, b = -1;
      for (let i = 0; i < n; i++) {
        if (!used[i]) continue;
        for (let j = 0; j < n; j++) {
          if (used[j]) continue;
          const d = Math.hypot(g[i].x - g[j].x, g[i].y - g[j].y);
          if (d < best) { best = d; a = i; b = j; }
        }
      }
      used[b] = true;
      edges.push([g[a], g[b]]);
    }
    return edges;
  }

  // Verbinding om andermans klavertjes heen buigen: per verbinding één kwadratische boog, naar de kant die het
  // minst hoeft uit te wijken. (Afwijking van de boog op fractie s: 2·s·(1−s)·push.)
  function routeEdges(gr, others) {
    const clear = R * 1.75;
    return mstEdges(gr).map(([a, b]) => {
      const dx = b.x - a.x, dy = b.y - a.y, L2 = dx * dx + dy * dy, L = Math.sqrt(L2) || 1;
      const nx = -dy / L, ny = dx / L;
      let needP = 0, needN = 0, any = false;
      for (const m of others) {
        const s = L2 ? ((m.x - a.x) * dx + (m.y - a.y) * dy) / L2 : 0;
        if (s <= .02 || s >= .98) continue;
        const sd = (m.x - a.x) * nx + (m.y - a.y) * ny;
        if (Math.abs(sd) >= clear) continue;
        any = true;
        const f = Math.max(.09, 2 * s * (1 - s));
        // naar +n: een klavertje aan de +kant moet voorbij (sd + clear), aan de −kant is clear − |sd| genoeg;
        // beide komen neer op clear + sd. Naar −n spiegelbeeldig: clear − sd.
        needP = Math.max(needP, (clear + sd) / f);
        needN = Math.max(needN, (clear - sd) / f);
      }
      if (!any) return { a, b, c: null };
      const dir = needP <= needN ? 1 : -1;
      const push = Math.min(dir > 0 ? needP : needN, L * 1.2) * dir;
      return { a, b, c: { x: (a.x + b.x) / 2 + nx * push, y: (a.y + b.y) / 2 + ny * push } };
    });
  }

  // Pad van alle verbindingen, tot fractie k getekend (een boog wordt via de Casteljau precies tot k gesplitst).
  function edgePath(g, edges, k) {
    for (const e of edges) {
      const { a, b, c } = e;
      g.moveTo(a.x, a.y);
      if (!c) { g.lineTo(a.x + (b.x - a.x) * k, a.y + (b.y - a.y) * k); continue; }
      const q0x = a.x + (c.x - a.x) * k, q0y = a.y + (c.y - a.y) * k;
      const q1x = c.x + (b.x - c.x) * k, q1y = c.y + (b.y - c.y) * k;
      g.quadraticCurveTo(q0x, q0y, q0x + (q1x - q0x) * k, q0y + (q1y - q0y) * k);
    }
  }

  // Teamgebied = capsules langs de verbindingen + schijf (1,7R) om elke speler, met heldere rand;
  // klavertjes van andere teams worden uitgespaard. Alleen opnieuw tekenen als er iemand verschuift.
  function buildTeamLayout() {
    const groups = [], others = [], routes = [];
    for (let t = 0; t < teamCount; t++) {
      groups.push(split.members.filter(m => m.team === t));
      others.push(split.members.filter(m => m.team !== t));
      routes.push(groups[t].length > 1 ? routeEdges(groups[t], others[t]) : []);
    }
    split.others = others;
    split.routes = routes;
    hctx.setTransform(1, 0, 0, 1, 0, 0);
    hctx.clearRect(0, 0, hullCv.width, hullCv.height);
    const wIn = R * 3.4, cut = R * 1.55;
    groups.forEach((gr, t) => {
      if (!gr.length) return;
      const g = htx, team = TEAMS[t];
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.globalCompositeOperation = 'source-over';
      g.clearRect(0, 0, hullTmp.width, hullTmp.height);
      g.setTransform(HS, 0, 0, HS, 0, 0);
      g.lineCap = 'round';
      g.lineJoin = 'round';
      g.beginPath();
      gr.forEach(m => { g.moveTo(m.x, m.y); g.lineTo(m.x + .01, m.y); });
      edgePath(g, routes[t], 1);
      g.lineWidth = wIn + 3;                         // rand: 1,5px in de lichte teamkleur
      g.strokeStyle = team.rim;
      g.stroke();
      g.globalCompositeOperation = 'destination-out';
      g.lineWidth = wIn;
      g.strokeStyle = '#000';
      g.stroke();
      g.globalCompositeOperation = 'source-over';
      g.strokeStyle = team.fill;                     // vulling (alfa zit al in de kleur)
      g.stroke();
      if (others[t].length) {
        g.beginPath();
        others[t].forEach(m => { g.moveTo(m.x + cut, m.y); g.arc(m.x, m.y, cut, 0, TAU); });
        g.globalCompositeOperation = 'destination-out';
        g.fillStyle = '#000';
        g.fill();
        g.globalCompositeOperation = 'source-over';
      }
      g.setTransform(1, 0, 0, 1, 0, 0);
      hctx.drawImage(hullTmp, 0, 0);                 // los per team: overlap mengt, overschrijft niet
    });
  }

  function layoutKey(members) {
    let k = W * 7 + H * 13;
    for (const m of members) k = (k * 31 + (m.x | 0) * 7 + (m.y | 0)) % 1000000007;
    return k;
  }

  function teamLines(edges, team, others, now, k) {
    ctx.save();
    // Veiligheidsnet: lijnen stoppen bij de ring van elk klavertje dat niet bij het team hoort.
    if (others.length) {
      ctx.beginPath();
      ctx.rect(0, 0, W, H);
      const cr = R * 1.5;
      others.forEach(m => { ctx.moveTo(m.x + cr, m.y); ctx.arc(m.x, m.y, cr, 0, TAU, true); });
      ctx.clip('evenodd');
    }
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    edgePath(ctx, edges, k);
    ctx.lineWidth = team.halo;
    ctx.strokeStyle = team.haloC;                  // halo: ook wit blijft zichtbaar
    ctx.stroke();
    ctx.lineWidth = 6.5;
    ctx.strokeStyle = team.hex;
    ctx.stroke();
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = 'rgba(255,255,255,.55)';    // glanzende kern
    ctx.stroke();
    if (!reduced) {
      ctx.setLineDash([.001, 20]);
      ctx.lineDashOffset = -now * .045;           // lichtpareltjes die over de lijn lopen
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = team.bead;
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

  function drawSplit(now) {
    const age = now - split.at;
    const k = reduced ? 1 : easeInOutCubic(clamp(age / 600));
    const key = layoutKey(split.members);
    if (key !== split.key) { split.key = key; buildTeamLayout(); }
    if (k > 0) {
      ctx.globalAlpha = k;
      ctx.drawImage(hullCv, 0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    split.routes.forEach((edges, t) => { if (edges.length) teamLines(edges, TEAMS[t], split.others[t], now, k); });
    split.members.forEach((m, i) => {
      const pop = reduced ? 1 : easeOutBack(clamp(age / 380));
      const pulse = reduced ? 1 : 1 + .04 * Math.sin(age / 190 + i);
      clover(m.x, m.y, TEAMS[m.team], (.85 + .25 * pop) * pulse, 1, m.num, m.rot, k);
    });
  }

  let lastFrame = performance.now();
  let boardDirty = true;
  function frame() {
    const now = performance.now();
    const elapsed = (now - lastFrame) / 1000;
    lastFrame = now;
    const wait = mode === 'tap' ? TAP_MS : HOLD_MS;
    const need = needPlayers();
    if (phase === 'gather' && fingers.size >= need && now - lastChange >= wait) startShuffle(now);
    if (phase === 'shuffle') stepShuffle(now);

    ghosts = ghosts.filter(g => now - g.t0 < 240);
    // Niets te tekenen (wachtscherm)? Dan het bord ook niet elk frame leegmaken.
    const busy = fingers.size > 0 || ghosts.length > 0 || !!winner || !!split;
    if (busy || boardDirty) ctx.clearRect(0, 0, W, H);
    boardDirty = busy;
    relayout(now);

    ghosts.forEach(g => { const k = (now - g.t0) / 240; clover(g.x, g.y, g.paint, 1 - k * .5, 1 - k, g.label, g.rot - k); });

    if (winner) {
      const fade = reduced ? 0 : clamp(1 - (now - winner.at) / 300);
      if (fade > 0) fingers.forEach(f => { if (f.id !== winner.id) clover(f.x, f.y, SHAMROCK, .6 + .4 * fade, fade, f.num, f.rot); });
      if (pour) renderPour(now, elapsed);
      drawShimmer(now);
      winnerClover(now);
    } else if (split) {
      drawSplit(now);
    } else {
      const counting = phase === 'gather' && fingers.size >= need;
      const p = clamp((now - lastChange) / wait);
      fingers.forEach(f => {
        const grow = clamp((now - f.born) / 360);
        let s = reduced ? 1 : easeOutBack(grow) * (1 + .04 * Math.sin((now - f.born) / 170));
        const rot = reduced ? f.rot : f.rot - (1 - easeInOutCubic(grow)) * 1.4 + .06 * Math.sin((now - f.born) / 600);
        let a = 1;
        let paint = paintFor();
        if (phase === 'shuffle') {
          if (teamCount) {
            if (shuffle.tint.has(f.id)) paint = TEAMS[shuffle.tint.get(f.id)];
          } else if (shuffle.hi != null) {
            if (f.id === shuffle.hi) { s *= 1.2; paint = GOLD; }
            else { s *= .88; a = .35; }
          }
        }
        clover(f.x, f.y, paint, s, a, f.num, rot);
        if (counting) countdown(f.x, f.y, R * s * 1.62, p);
      });
    }
    requestAnimationFrame(frame);
  }

  // Voorbeeldronde zonder touchscreen: open de pagina met #demo
  if (location.hash === '#demo') {
    setTimeout(() => {
      const now = performance.now();
      [[.26, .28], [.72, .2], [.5, .47], [.2, .7], [.8, .64], [.54, .84]]
        .forEach((p, i) => addFinger(9000 + i, p[0] * W, p[1] * H, now));
      syncUI();
    }, 400);
  }

  // Lettertype voor de cijfers alvast laden (Android/desktop); op iPhone is het systeemfont er al.
  try { if (document.fonts && document.fonts.load) document.fonts.load('700 32px Inter').then(() => seg.place(true)); } catch (_) {}

  buildMarkerSprites();
  buildSprites();           // vonkjes, druppels, belletjes: hangen niet van het schermformaat af
  resize();
  syncUI();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
