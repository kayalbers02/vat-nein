        g.beginPath(); g.moveTo(x, d > 0 ? y0 + curve : y0 - curve); g.lineTo(x, d > 0 ? y0 + hgt + curve : y0 + hgt - curve); g.stroke();
      }
      g.globalAlpha = 1;
    }
    g.save();
    g.scale(1, ac);
    const sh = .45 * Rc * s;
    const face = g.createLinearGradient(-Rc + sh, -Rc + sh, Rc + sh, Rc + sh);
    face.addColorStop(0, '#fff1b8');
    face.addColorStop(.18, '#f2c94c');
    face.addColorStop(.45, '#c8952b');
    face.addColorStop(.62, '#8c6114');
    face.addColorStop(.8, '#d9a93a');
    face.addColorStop(1, '#f5d46e');
    g.fillStyle = face;
    g.beginPath(); g.arc(0, 0, Rc, 0, TAU); g.fill();
    const rev = g.createLinearGradient(Rc + sh, Rc + sh, -Rc + sh, -Rc + sh);
    rev.addColorStop(0, '#fff1b8');
    rev.addColorStop(.3, '#e2b445');
    rev.addColorStop(.55, '#8c6114');
    rev.addColorStop(1, '#f5d46e');
    g.strokeStyle = rev;
    g.lineWidth = .1 * Rc;
    g.beginPath(); g.arc(0, 0, Rc * .87, 0, TAU); g.stroke();
    g.strokeStyle = 'rgba(70,42,6,.35)';
    g.lineWidth = .7;
    g.beginPath(); g.arc(0, 0, Rc * .79, 0, TAU); g.stroke();
    // klavertje in reliëf
    const emb = (dx, dy, col, a) => {
      g.save();
      g.translate(dx, dy);
      g.globalAlpha = a;
      g.fillStyle = col;
      for (let i = 0; i < 4; i++) {
        g.save();
        g.rotate(Math.PI / 4 + i * Math.PI / 2);
        g.scale(Rc * .34, Rc * .34);
        g.fill(LEAF);
        g.restore();
      }
      g.restore();
    };
    emb(.8, .8, '#5a3a06', .4);
    emb(-.7, -.7, '#fff3c4', .55);
    emb(0, 0, '#c8952b', 1);
    g.globalAlpha = 1;
    g.strokeStyle = 'rgba(80,52,8,.55)';
    g.lineWidth = .6;
    g.beginPath(); g.arc(0, 0, Rc - .3, 0, TAU); g.stroke();
    g.restore();
  }

  const FRAMES = 24;
  function buildCoins() {
    const Rc = coinR();
    const T = Rc * .16;
    const cs = Math.ceil((2 * Rc + 2 * T + 8) * DPR);
    const cv = mkCanvas(cs * 8, cs * 6);
    const g = cv.getContext('2d');
    for (let wet = 0; wet < 2; wet++) {
      for (let i = 0; i < FRAMES; i++) {
        const col = i % 8, row = Math.floor(i / 8) + wet * 3;
        g.save();
        g.beginPath(); g.rect(col * cs, row * cs, cs, cs); g.clip();
        g.setTransform(DPR, 0, 0, DPR, col * cs + cs / 2, row * cs + cs / 2);
        paintCoin(g, i / FRAMES * TAU, Rc, T);
        if (wet) {
          // onder het bier: donkerder en warmer, de glans blijft
          g.globalCompositeOperation = 'source-atop';
          g.fillStyle = 'rgba(46,14,8,.32)';
          g.fillRect(-cs, -cs, 2 * cs, 2 * cs);
        }
        g.restore();
      }
    }
    tex.coin = cv;
    tex.cs = cs;
    tex.Rc = Rc;
    tex.T = T;
  }

  // De stapel is een eigen <canvas> in de pagina (onder het bord), alleen bijgewerkt als er een munt landt.
  function buildPile() {
    tex.pileY = Math.floor(H * .5);
    pileCv.width = Math.max(1, Math.ceil(W * DPR));
    pileCv.height = Math.max(1, Math.ceil((H - tex.pileY) * DPR));
    pileCv.style.top = tex.pileY + 'px';
    pileCv.style.height = (H - tex.pileY) + 'px';
    tex.pile = pileCv;
    tex.pileCtx = tex.pileCtx || pileCv.getContext('2d');
  }

  function ensureSized() {
    const key = W + 'x' + H + '@' + DPR + ':' + SAFE_T;
    if (tex.key === key) return;
    ensureStatic();
    if (tex.spriteDpr !== DPR) buildSprites();
    buildRuby();
    buildFoam();
    buildCoins();
    buildPile();
    tex.key = key;
  }

  // =====================================================================
  //  Klavertje vier (bovenste canvas): donkergroen met een gouden rand,
  //  nummer in SF Pro Rounded op een donker hart. In teams: halo + badge.
  // =====================================================================
  const numFont = px => `700 ${Math.max(1, Math.round(px))}px ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, "Nunito", "Segoe UI", Roboto, sans-serif`;
  const badgeFont = px => `800 ${Math.max(1, Math.round(px))}px ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, "Nunito", "Segoe UI", Roboto, sans-serif`;

  function paintGrads(p) {
    const c = mctx;
    p.grad = c.createRadialGradient(0, -.62, .03, 0, -.5, .78);
    p.grad.addColorStop(0, p.light);
    p.grad.addColorStop(.55, p.leaf);
    p.grad.addColorStop(1, p.dark);
    p.rimGrad = c.createLinearGradient(0, -1, 0, 0);
    p.rimGrad.addColorStop(0, p.rim);
    p.rimGrad.addColorStop(.6, p.rim);
    p.rimGrad.addColorStop(1, p.rimDark);
    p.sheenGrad = c.createLinearGradient(-.62, -.9, .5, -.3);
    p.sheenGrad.addColorStop(0, 'rgba(255,255,255,0)');
    p.sheenGrad.addColorStop(.38, 'rgba(255,255,255,0)');
    p.sheenGrad.addColorStop(.48, `rgba(255,255,255,${.28 * p.sheen})`);
    p.sheenGrad.addColorStop(.6, 'rgba(255,255,255,0)');
  }

  function clover(x, y, paint, s, a, label, rot, team) {
    if (a <= 0 || s <= 0) return;
    const c = mctx;
    const rad = R * s;
    c.save();
    c.globalAlpha = a * .9;
    if (tex.shadow) c.drawImage(tex.shadow, x - rad * 1.55, y - rad * 1.55 + rad * .16, rad * 3.1, rad * 3.1);
    c.globalAlpha = a;
    c.translate(x, y);
    if (team) {
      // teamhalo: donkere contour + teamkleur + glans, leesbaar op elke ondergrond
      const hr = rad * 1.34;
      c.beginPath(); c.arc(0, 0, hr, 0, TAU);
      c.lineWidth = 12; c.strokeStyle = team.glow; c.stroke();
      c.lineWidth = 7; c.strokeStyle = 'rgba(6,4,3,.6)'; c.stroke();
      c.lineWidth = 3.5; c.strokeStyle = team.hex; c.stroke();
      c.beginPath(); c.arc(0, 0, hr, -2.6, -1.2);
      c.lineWidth = 1.2; c.strokeStyle = 'rgba(255,255,255,.55)'; c.stroke();
    }
    c.save();
    c.rotate(rot || 0);
    // steeltje, tussen de twee onderste blaadjes door
    c.strokeStyle = paint.rimDark;
    c.lineWidth = rad * .1;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(0, rad * .2);
    c.quadraticCurveTo(rad * .02, rad * .85, rad * .32, rad * 1.3);
    c.stroke();
    if (!paint.grad) paintGrads(paint);
    const len = rad * 1.08;
    for (let i = 0; i < 4; i++) {
      c.save();
      c.rotate(Math.PI / 4 + i * Math.PI / 2);
      c.scale(len, len);
      c.fillStyle = paint.grad;
      c.fill(LEAF);
      c.fillStyle = paint.sheenGrad;
      c.fill(LEAF);
      c.lineWidth = .05;
      c.strokeStyle = paint.rimGrad;
      c.stroke(LEAF);
      c.globalAlpha = a * .35;                 // nerf
      c.strokeStyle = paint.light;
      c.lineWidth = .026;
      c.beginPath(); c.moveTo(0, -.18); c.lineTo(0, -.7); c.stroke();
      c.globalAlpha = a;
      c.restore();
    }
    c.restore();

    // hart met nummer, altijd rechtop
    c.fillStyle = '#0d0907';
    c.beginPath(); c.arc(0, 0, rad * .47, 0, TAU); c.fill();
    c.lineWidth = rad * .05;
    c.strokeStyle = paint.ring;
    c.stroke();
    c.lineWidth = 1;
    c.strokeStyle = 'rgba(255,248,232,.10)';
    c.beginPath(); c.arc(0, 0, rad * .385, 0, TAU); c.stroke();
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    if (label != null) {
      c.fillStyle = paint.num;
      c.font = numFont(rad * (label > 9 ? .48 : .6));
      c.fillText(String(label), 0, rad * .035);
    }
    if (team) {
      // teambadge op de halo (initiaal van het team)
      const br = Math.max(9, rad * .25);
      const bx = Math.cos(-Math.PI / 4) * rad * 1.34, by = Math.sin(-Math.PI / 4) * rad * 1.34;
      c.fillStyle = 'rgba(6,4,3,.75)';
      c.beginPath(); c.arc(bx, by, br + 2.5, 0, TAU); c.fill();
      c.fillStyle = team.hex;
      c.beginPath(); c.arc(bx, by, br, 0, TAU); c.fill();
      c.fillStyle = '#140d08';
      c.font = badgeFont(br * 1.15);
      c.fillText(team.initial, bx, by + br * .06);
    }
    c.restore();
  }

  function countdown(x, y, rad, p) {
    const c = mctx;
    c.lineWidth = 3;
    c.strokeStyle = 'rgba(243,230,200,.16)';
    c.beginPath(); c.arc(x, y, rad, 0, TAU); c.stroke();
    const a1 = -Math.PI / 2 + TAU * p;
    c.strokeStyle = '#f3dfae';
    c.lineCap = 'round';
    c.lineWidth = 3.5;
    c.beginPath(); c.arc(x, y, rad, -Math.PI / 2, a1); c.stroke();
    c.fillStyle = '#fffaf0';
    c.beginPath(); c.arc(x + Math.cos(a1) * rad, y + Math.sin(a1) * rad, 3.4, 0, TAU); c.fill();
    c.lineCap = 'butt';
  }

  // =====================================================================
  //  Achtergrond: een nauwelijks zichtbare stikstofcascade.
  // =====================================================================
  const AN = 54;
  const amb = { x: new Float32Array(AN), y: new Float32Array(AN), v: new Float32Array(AN), s: new Float32Array(AN), a: new Float32Array(AN), ph: new Float32Array(AN), ready: false };
  function drawAmbient(t, dt) {
    if (!tex.dot) return;
    if (!amb.ready) {
      for (let i = 0; i < AN; i++) {
        amb.x[i] = Math.random() * W;
        amb.y[i] = Math.random() * H;
        amb.v[i] = 6 + Math.random() * 14;
        amb.s[i] = .5 + Math.random() * 1.1;
        amb.a[i] = .05 + Math.random() * .14;
        amb.ph[i] = Math.random() * TAU;
      }
      amb.ready = true;
    }
    const c = ctx;
    for (let i = 0; i < AN; i++) {
      if (!reduced) {
        const q = Math.abs(2 * amb.x[i] / W - 1);
        amb.y[i] += amb.v[i] * (1 + 2.2 * q * q) * dt;   // langs de randen zakt het sneller
        if (amb.y[i] > H + 4) { amb.y[i] = -4; amb.x[i] = Math.random() * W; }
      }
      const x = amb.x[i] + (reduced ? 0 : 4 * Math.sin(t * .45 + amb.ph[i]));
      c.globalAlpha = amb.a[i] * (reduced ? 1 : .75 + .25 * Math.sin(t * 1.3 + amb.ph[i] * 3));
      const r = amb.s[i];
      c.drawImage(tex.dot, x - r, amb.y[i] - r, r * 2, r * 2);
    }
    c.globalAlpha = 1;
  }

  // =====================================================================
  //  Teams: zachte teamgebieden + gloeiende verbindingslijnen met een lichtpuls.
  // =====================================================================
  // Per team een minimale opspannende boom (Prim): n−1 korte lijnen, bijna nooit kruisend met andere teams.
  // Elke lijn loopt van ouder naar kind, zodat het licht vanuit één middelpunt naar buiten stroomt.
  let fieldCv = null, fieldCtx = null, layerCv = null, layerCtx = null, teamKey = '', teamGeo = [];
  function spanningTree(group) {
    const n = group.length;
    if (n < 2) return [];
    const cx = group.reduce((s, m) => s + m.x, 0) / n, cy = group.reduce((s, m) => s + m.y, 0) / n;
    let root = 0;
    group.forEach((m, i) => { if (Math.hypot(m.x - cx, m.y - cy) < Math.hypot(group[root].x - cx, group[root].y - cy)) root = i; });
    const inTree = new Array(n).fill(false), dist = new Array(n).fill(Infinity), from = new Array(n).fill(-1);
    dist[root] = 0;
    const edges = [];
    for (let step = 0; step < n; step++) {
      let v = -1;
      for (let i = 0; i < n; i++) if (!inTree[i] && (v < 0 || dist[i] < dist[v])) v = i;
      inTree[v] = true;
      if (from[v] >= 0) edges.push([group[from[v]], group[v]]);
      for (let i = 0; i < n; i++) {
        if (inTree[i]) continue;
        const d = Math.hypot(group[i].x - group[v].x, group[i].y - group[v].y);
        if (d < dist[i]) { dist[i] = d; from[i] = v; }
      }
    }
    return edges;
  }
  function buildTeamGeo() {
    const key = split.members.map(m => Math.round(m.x) + ',' + Math.round(m.y) + ',' + m.team).join(';') + '|' + W + 'x' + H;
    if (key === teamKey) return;
    teamKey = key;
    teamGeo = [];
    for (let t = 0; t < teamCount; t++) {
      const group = split.members.filter(m => m.team === t);
      const edges = spanningTree(group);
      const path = new Path2D();
      let maxLen = 0;
      edges.forEach(([a, b]) => {
        path.moveTo(a.x, a.y);
        path.lineTo(b.x, b.y);
        maxLen = Math.max(maxLen, Math.hypot(b.x - a.x, b.y - a.y));
      });
      teamGeo.push({ t, group, path, maxLen });
    }
    // Zachte teamgebieden: capsules langs de boom, per team de schijven van andere teams eruit geknipt.
    const s = .5;
    const w = Math.ceil(W * s), h = Math.ceil(H * s);
    if (!fieldCv) {
      fieldCv = document.createElement('canvas'); fieldCtx = fieldCv.getContext('2d');
      layerCv = document.createElement('canvas'); layerCtx = layerCv.getContext('2d');
    }
    [fieldCv, layerCv].forEach(cv => { if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; } });
    const f = fieldCtx, g = layerCtx;
    f.setTransform(1, 0, 0, 1, 0, 0);
    f.clearRect(0, 0, w, h);
    teamGeo.forEach(({ t, group, path }) => {
      if (!group.length) return;
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.globalCompositeOperation = 'source-over';
      g.clearRect(0, 0, w, h);
      g.setTransform(s, 0, 0, s, 0, 0);
      g.lineCap = 'round';
      g.lineJoin = 'round';
      g.lineWidth = R * 1.5;
      g.strokeStyle = g.fillStyle = TEAMS[t].hex;
      g.stroke(path);
      g.beginPath();
      group.forEach(m => { g.moveTo(m.x + R * .9, m.y); g.arc(m.x, m.y, R * .9, 0, TAU); });
      g.fill();
      g.globalCompositeOperation = 'destination-out';
      g.beginPath();
      split.members.forEach(m => { if (m.team !== t) { g.moveTo(m.x + R * 1.3, m.y); g.arc(m.x, m.y, R * 1.3, 0, TAU); } });
      g.fill();
      g.globalCompositeOperation = 'source-over';
      f.drawImage(layerCv, 0, 0);
    });
  }

  function drawSplitBoard(now) {
    const age = now - split.at;
    const k = reduced ? 1 : easeInOutCubic(clamp(age / 700));
    buildTeamGeo();
    const c = ctx;
    c.globalAlpha = .18 * k;
    c.drawImage(fieldCv, 0, 0, W, H);
    c.globalAlpha = 1;
    c.save();
    c.lineCap = 'round';
    c.lineJoin = 'round';
    teamGeo.forEach(({ t, path, maxLen }) => {
      if (maxLen < 1) return;
      const team = TEAMS[t];
      // lijnen groeien vanuit het middelpunt van het team naar buiten
      c.setLineDash(k < 1 ? [maxLen * k, maxLen + 20] : []);
      c.lineDashOffset = 0;
      c.lineWidth = 18; c.strokeStyle = team.glow; c.stroke(path);              // gloed
      c.lineWidth = 9; c.strokeStyle = 'rgba(6,4,3,.62)'; c.stroke(path);       // contrastrand
      c.lineWidth = 5; c.strokeStyle = team.hex; c.stroke(path);                // teamkleur
      c.lineWidth = 1.4; c.strokeStyle = 'rgba(255,255,255,.55)'; c.stroke(path); // glanslijn
      if (k >= 1 && !reduced) {
        // een lichtpuls die over elke lijn naar buiten reist
        const P = 240, seg = 40;
        c.setLineDash([seg, P - seg]);
        c.lineDashOffset = -((age * .11) % P) + seg;
        c.lineWidth = 11; c.strokeStyle = team.pulse; c.stroke(path);
        c.lineWidth = 3.2; c.strokeStyle = 'rgba(255,252,240,.92)'; c.stroke(path);
      }
    });
    c.setLineDash([]);
    c.restore();
    c.globalAlpha = 1;
  }

  // =====================================================================
  //  Het glas loopt vol: surge, cascade, bezinken, robijnrood licht,
  //  een dichte schuimkraag en gouden munten die erin vallen.
  //  Macro-tijdlijn ingedikt (~2 min → ~6 s), micro-beweging bijna echt.
  // =====================================================================
  const K = 1.1;               // tijdschaal van de schenk-tijdlijn
  const END_U = 5.3;           // vanaf hier staat het glas stil
  const PN = 760;              // microbelletjes in de cascade (bord-canvas, volle resolutie)
  const PN_LOW = 300;
  const G = 2400;              // zwaartekracht (px/s²)
  const BIN = 3;               // breedte van een stapelkolom (px)
  const FXN = 240;
  const QUIET_U = END_U + 6;   // daarna geen glinsteringen of knappende belletjes meer
  const FREEZE_U = END_U + 6.4;

  // Basislijn van de beeldfrequentie, gemeten in rustige fases (zelfde rAF-limiet, zelfde toestand).
  const baseRing = new Float32Array(64);
  let baseN = 0;
  function noteBaseline(raw) { baseRing[baseN++ % 64] = Math.min(raw, .05); }
  function median(arr, n) {
    const a = Array.prototype.slice.call(arr, 0, n).sort((x, y) => x - y);
    return a.length ? a[a.length >> 1] : 1 / 60;
  }

  function makeBeer(at, instant) {
    ensureSized();
    // Kwaliteit alleen bij het begin van een glas aanpassen, nooit halverwege.
    const want = liquidScale();
    if (want !== LS) { LS = want; fit(liquidCv, lctx, LS); }
    const Rc = tex.Rc;
    const b = {
      at, instant,
      ofs: { l1: 0, l2: 0, l3: 0, l4: 0, band: 0, band2: 0, core: 0 },
      p: { x: new Float32Array(PN), y: new Float32Array(PN), j: new Float32Array(PN), k: new Uint8Array(PN), seeded: false },
      coins: [], next: 0, active: [], acc: 0,
      heap: new Float32Array(Math.ceil(W / BIN) + 2),
      fx: { x: new Float32Array(FXN), y: new Float32Array(FXN), vx: new Float32Array(FXN), vy: new Float32Array(FXN), life: new Float32Array(FXN), max: new Float32Array(FXN), r: new Float32Array(FXN), kind: new Uint8Array(FXN), n: 0 },
      dents: [], sp: [], shimmer: [], nextShimmer: 0, pops: [], nextPop: 0,
      q: { f: 0, n: 0, s: new Float32Array(24), done: !!instant, base: baseN ? median(baseRing, Math.min(baseN, 64)) : 1 / 60 },
      qm: lowQ ? 0 : 1, qAt: -1,
      liquidDone: false, frozen: false, geo: null, pileOp: -1, cloud: null,
      hang: [],
    };
    for (let i = 0; i < 40; i++) b.hang.push({ x: Math.random() * W, dy: 2 + Math.random() * 7, r: .5 + Math.random() * .6 });
    const pc = tex.pileCtx;
    pc.setTransform(1, 0, 0, 1, 0, 0);
    pc.clearRect(0, 0, tex.pile.width, tex.pile.height);
    const n = coinCount();
    for (let i = 0; i < n; i++) {
      b.coins.push({
        t0: 2.0 + (i / n) * 2.6 + Math.random() * .12,
        x: W * (.06 + .88 * Math.random()),
        y: -Rc * 2 - Math.random() * 40,
        vx: (Math.random() - .5) * 30,
        vy: Math.random() * 200,
        phi: Math.random() * TAU,
        w: (6 + Math.random() * 4) * (Math.random() < .5 ? -1 : 1),
        rot: (Math.random() - .5) * 1.2,
        wr: (Math.random() - .5) * 6,
        st: 0, bounced: false, seed: Math.random() * TAU, spark: 0, trail: 0,
      });
    }
    if (instant) {
      b.coins.forEach(k => restCoin(b, k, 0));
      b.next = b.coins.length;
    }
    liquidCv.style.visibility = 'visible';
    pileCv.style.visibility = 'visible';
    pileCv.style.opacity = '';
    return b;
  }

  // Vorm van de schuimkraag op tijdstip u (macro) en t (seconden)
  function pourGeo(u, t) {
    const base = headBase();
    const Hh = headH();
    let topY, th;
    if (u < .9) {
      const p = easeOutCubic(clamp(u / .9));
      topY = H - (H - base) * p;
      th = 16 + 8 * p;
    } else {
      topY = base;
      th = 24 + (Hh - 24) * easeOutQuad(clamp((u - .9) / 3.5));
    }
    const amp = (2 + 8 * Math.exp(-3 * t)) * (1 - smooth(.9, 1.6, u));
    const dome = u < 4.6 ? 0 : 10 * springStep((u - 4.6) * K);
    return { topY, th, amp, dome, t, hl: .4 + .35 * clamp((u - 4.6) / .6), tan: .55 * (1 - smooth(1.0, 4.2, u)) };
  }
  function topAt(geo, x) {
    const q = 2 * x / W - 1;
    return geo.topY + geo.amp * Math.sin(TAU * 1.2 * x / W + 9 * geo.t) - geo.dome * (1 - q * q) - (x < 5 || x > W - 5 ? 3 : 0);
  }
  function botAt(geo, x) {
    return geo.topY + geo.th + 3 * Math.sin(TAU * 1.5 * x / W + .8 * geo.t);
  }

  // Tegels onder elkaar en naast elkaar, verschoven over (ox, oy), alleen tussen y0 en y1.
  function tile(c, img, scale, ox, oy, alpha, y0, y1) {
    if (alpha <= .02 || y1 <= y0) return;
    const tw = img.width * scale, th = img.height * scale;
    const sx = ((ox % tw) + tw) % tw - tw;
    const sy = y0 - ((((y0 - oy) % th) + th) % th);
    c.globalAlpha = alpha;
    for (let y = sy; y < y1; y += th) for (let x = sx; x < W; x += tw) c.drawImage(img, x, y, tw, th);
  }
  function tileStretch(c, img, th, oy, alpha, y0, y1) {
    if (alpha <= .02 || y1 <= y0) return;
    const sy = y0 - ((((y0 - oy) % th) + th) % th);
    c.globalAlpha = alpha;
    for (let y = sy; y < y1; y += th) c.drawImage(img, 0, y, W, th);
  }

  const frontYs = new Float32Array(1024);
  function drawLiquid(b, u, t, dt, geo, age) {
    b.cloud = null;
    if (b.liquidDone) return;
    const c = lctx;
    c.setTransform(LS, 0, 0, LS, 0, 0);
    c.globalCompositeOperation = 'source-over';
    c.globalAlpha = 1;
    c.clearRect(0, 0, W, H);
    const settled = u >= END_U;
    const fade = reduced ? clamp(age / 400) : 1;
    const top = Math.max(0, geo.topY + Math.min(geo.amp + 3, geo.th * .5));
    const qm = b.qm;
    if (top < H) {
      c.save();
      c.beginPath(); c.rect(0, top, W, H - top + 2); c.clip();
      if (!settled) {
        const hb = geo.topY + geo.th;
        const prog = clamp((u - 1.6) / 2.8);
        // het bezinkfront komt van onder het scherm en eindigt ruim onder de kraag
        const start = H + FRONT_UP + 20;
        const front = u < 1.6 ? start : start - (start - (hb - 50)) * easeInOutCubic(prog);
        const Ic = 1 - .2 * prog;
        const churn = u < .6 ? 1.6 : 1.6 - 1.2 * smooth(.6, 3.0, u);
        const yb = Math.min(H, front + 40);
        const o = b.ofs;
        o.l1 -= 70 * churn * dt;
        o.l2 += 35 * churn * dt;
        o.l3 += 20 * dt;
        o.l4 -= 90 * dt;
        // cascade: banden zakken langs de wand, de kern stijgt
        const ic = u < 1 ? 0 : u < 1.6 ? (u - 1) / .6 : u < 3 ? 1 - .4 * (u - 1.6) / 1.4 : .6;
        const vb = u < 1.6 ? 140 + 120 * (u / 1.6) : 260 - 150 * clamp((u - 1.6) / 2.6);
        if (yb > top) {
          // 1. de surge: een lichte, romige latte-wolk die kolkt
          c.globalAlpha = .92 * fade;
          c.fillStyle = '#8c6c51';
          c.fillRect(0, top, W, yb - top);
          tile(c, tex.noiseL, 3.0, 12 * Math.sin(.7 * t), o.l1, .6 * Ic * fade, top, yb);
          tile(c, tex.noiseL, 1.6, -8 * Math.sin(1.1 * t + 1), o.l2, .4 * Ic * fade, top, yb);
          tile(c, tex.noiseD, 2.2, o.l3, o.l3 * .3, .4 * Ic * fade, top, yb);
          if (u > .3 && u < 1.8) tile(c, tex.noiseP, 2.6, 0, o.l4, qm * .25 * smooth(.3, .5, u) * (1 - smooth(1.4, 1.8, u)) * fade, top, yb);
          // waar de straal het bier in slaat
          if (u < 1.0) {
            c.save();
            c.globalAlpha = (1 - smooth(.6, 1.0, u)) * fade;
            c.translate(W / 2, geo.topY + 90);
            c.rotate(t * 1.3);
            const sz = 240 * (1 + .08 * Math.sin(t * 9));
            c.drawImage(tex.blob, -sz / 2, -sz / 2, sz, sz);
            c.restore();
          }
          if (ic > 0) {
            o.band += vb * dt;
            o.band2 += vb * .75 * dt;
            o.core -= 45 * dt;
            tileStretch(c, tex.band, BAND_H, o.band, .6 * ic * fade, top, yb);
            if (qm > .01) {
              c.save();
              c.translate(W, 0);
              c.scale(-1, 1);
              tileStretch(c, tex.band, BAND_H * .6, o.band2, .3 * ic * qm * fade, top, yb);
              c.restore();
            }
            tileStretch(c, tex.core, 640, o.core, .18 * ic * fade, top, yb);
            // donkere, bubbelvrije film tegen het glas
            c.globalAlpha = Math.min(1, ic * 1.4) * fade;
            c.fillStyle = tex.wallL; c.fillRect(0, top, 10, yb - top);
            c.fillStyle = tex.wallR; c.fillRect(W - 10, top, 10, yb - top);
          }
          // samengeperst onder de kraag: de wolk wordt daar lichter en dichter, niet donkerder
          if (u >= 1.6) {
            c.globalAlpha = .6 * smooth(.05, .7, prog) * fade;
            c.drawImage(tex.dense, 0, hb, W, Math.max(24, (front - hb) * .6));
          }
          // 2. het front vreet de wolk van onderaf weg, in slierten (randen slepen achter, midden voorop)
          if (u >= 1.6 && front - FRONT_UP < H) {
            c.globalCompositeOperation = 'destination-out';
            c.globalAlpha = 1;
            const N = Math.min(1023, Math.ceil(W / FRONT_SL)), sw = W / N, arch = .03 * H;
            for (let i = 0; i < N; i++) {
              const x = (i + .5) * sw;
              const q = 2 * x / W - 1;
              frontYs[i] = front - arch * (1 - q * q) + 6 * Math.sin(TAU * 1.6 * x / W + 1.7 * t) + 2.5 * Math.sin(TAU * 3.7 * x / W - 2.3 * t);
            }
            for (let i = 0; i < N; i++) {
              const x0 = Math.round(i * sw * LS) / LS, x1 = Math.round((i + 1) * sw * LS) / LS;
              c.drawImage(tex.front, (i % (FRONT_W / FRONT_SL)) * FRONT_SL, 0, FRONT_SL, FRONT_H, x0, frontYs[i] - FRONT_UP, x1 - x0, FRONT_H);
            }
            const dy = FRONT_H - FRONT_UP - 6;
            c.beginPath();
            c.moveTo(0, frontYs[0] + dy);
            for (let i = 0; i < N; i++) c.lineTo((i + .5) * sw, frontYs[i] + dy);
            c.lineTo(W, frontYs[N - 1] + dy);
            c.lineTo(W, H + 2);
            c.lineTo(0, H + 2);
            c.closePath();
            c.fillStyle = '#000';
            c.fill();
            c.globalCompositeOperation = 'source-over';
          }
        }
        // laatste slierten onder de kraag
        if (u > 4.0 && u < 4.8) {
          c.globalAlpha = (1 - smooth(4.2, 4.75, u)) * fade;
          c.drawImage(tex.wisp, 0, hb - 4, W, 18);
        }
        b.cloud = { hb, front, vb };
      }
      // 3. de heldere stout erachter (destination-over: achter de wolk): robijnrood licht, dan bijna zwart.
      //    Het rood verschijnt zodra er onderin helder bier is, het sterkst langs de randen en onderin.
      const ruby = settled ? 1 : easeOutCubic(clamp((u - 1.75) / 1.6));
      c.globalCompositeOperation = 'destination-over';
      if (ruby > 0) {
        c.globalAlpha = ruby * fade;
        c.drawImage(tex.ruby, 0, 0, W, H);
      }
      c.globalAlpha = fade;
      c.fillStyle = '#0a0605';
      c.fillRect(0, top, W, H - top);
      c.globalCompositeOperation = 'source-over';
      c.restore();
    }
    if (!b.instant && u < 1.0) drawStream(c, u, t, geo);
    c.globalAlpha = 1;
    if (settled && (!reduced || age > 420)) b.liquidDone = true;   // stilstaand beeld: niet meer hertekenen
  }

  // De straal uit de tap, die bij 0,75 s loskomt en wegvalt.
  function drawStream(c, u, t, geo) {
    const surf = geo.topY + 6;
    let y0 = 0;
    if (u > .75) y0 = .5 * G * Math.pow((u - .75) * K, 2);
    if (y0 >= surf - 2) return;
    const cx = W / 2 + 2.5 * Math.sin(t * 7);
    const w0 = 11, w1 = 8;
    c.save();
    c.globalAlpha = 1;
    c.beginPath();
    c.moveTo(cx - w0, y0);
    c.lineTo(cx + w0, y0);
    c.lineTo(cx + w1, surf);
    c.lineTo(cx - w1, surf);
    c.closePath();
    c.fillStyle = '#1c0e09';
    c.fill();
    c.clip();
    c.globalAlpha = .5;
    const off = (t * 900) % BAND_H;
    for (let y = off - BAND_H; y < surf; y += BAND_H) c.drawImage(tex.band, cx - w0, y, w0 * 2, BAND_H);
    c.globalAlpha = .2;
    c.fillStyle = '#e8d2b4';
    c.fillRect(cx - w0 * .45, y0, 1.5, surf - y0);
    c.restore();
  }

  // Microbelletjes (bord-canvas, volle resolutie): fijne verticale streepjes die langs de wand omlaag
  // stromen en in het midden omhoog. Dit is de beweging waar je naar kijkt in een echte nitro-cascade.
  function particles(c, b, u, t, dt) {
    const cl = b.cloud;
    if (!cl || u < .85) return;
    const p = b.p;
    const lo = cl.hb + 2, hi = Math.min(H, cl.front - 4);
    if (hi - lo < 4) return;
    const live = Math.round(lerp(PN_LOW, PN, b.qm) * (u < 1.6 ? 1 : clamp(1 - (u - 1.6) / 2.8)));
    const spawn = i => {
      p.x[i] = Math.random() * W;
      p.y[i] = lo + Math.random() * (hi - lo);
      p.j[i] = Math.random();
      const r = Math.random();
      p.k[i] = r < .8 ? 0 : r < .97 ? 1 : 2;
    };
    if (!p.seeded) { for (let i = 0; i < PN; i++) spawn(i); p.seeded = true; }
    for (let i = 0; i < live; i++) {
      const x = p.x[i];
      const e = smooth(.45, .95, Math.abs(2 * x / W - 1));
      const vy = p.k[i] === 2 ? -(40 + 20 * p.j[i]) : cl.vb * e * (.85 + .3 * p.j[i]) - 40 * (1 - e);
      const vx = 10 * Math.sin(p.y[i] / 90 + 1.3 * t) + 6 * (p.j[i] * 2 - 1);
      p.x[i] += vx * dt;
      p.y[i] += vy * dt;
      if (p.y[i] > hi || p.y[i] < lo || p.x[i] < 0 || p.x[i] > W) spawn(i);
    }
    // één vulling per helderheid (geen honderden losse tekenopdrachten)
    c.fillStyle = '#dcc6a8';
    c.globalAlpha = .32;
    c.beginPath();
    for (let i = 0; i < live; i++) if (p.k[i] === 0) c.rect(p.x[i], p.y[i], .7, 2 + 2 * p.j[i]);
    c.fill();
    c.globalAlpha = .58;
    c.beginPath();
    for (let i = 0; i < live; i++) if (p.k[i] === 1) c.rect(p.x[i], p.y[i], .8, 2.5 + 1.5 * p.j[i]);
    c.fill();
    c.globalAlpha = .6;
    for (let i = 0; i < live; i++) {
      if (p.k[i] !== 2) continue;
      const r = 1.3 + p.j[i] * .8;
      c.drawImage(tex.dot, p.x[i] - r, p.y[i] - r, r * 2, r * 2);
    }
    c.globalAlpha = 1;
  }

  // ---------- munten: vallen, spatten in de kraag, zinken, stapelen ----------
  const heapAt = (b, x) => b.heap[Math.max(0, Math.min(b.heap.length - 1, Math.floor(x / BIN)))];
  function heapMax(b, x, hw) {
    let m = 0;
    const i0 = Math.max(0, Math.floor((x - hw) / BIN)), i1 = Math.min(b.heap.length - 1, Math.floor((x + hw) / BIN));
    for (let i = i0; i <= i1; i++) if (b.heap[i] > m) m = b.heap[i];
    return m;
  }
  function heapMean(b, x, hw) {
    let s = 0, n = 0;
    const i0 = Math.max(0, Math.floor((x - hw) / BIN)), i1 = Math.min(b.heap.length - 1, Math.floor((x + hw) / BIN));
    for (let i = i0; i <= i1; i++) { s += b.heap[i]; n++; }
    return n ? s / n : 0;
  }
  const frameOf = phi => ((Math.round(phi / TAU * FRAMES) % FRAMES) + FRAMES) % FRAMES;

  function emit(b, kind, x, y, vx, vy, life, r) {
    const f = b.fx;
    const i = f.n++ % FXN;
    f.kind[i] = kind; f.x[i] = x; f.y[i] = y; f.vx[i] = vx; f.vy[i] = vy; f.life[i] = life; f.max[i] = life; f.r[i] = r;
  }

  function splash(b, x, y, t) {
    for (let i = 0; i < 8; i++) {
      const a = -Math.PI / 2 + (Math.random() * 2 - 1) * 55 * DEG;
      const sp = 220 + Math.random() * 260;
      emit(b, 0, x, y, Math.cos(a) * sp, Math.sin(a) * sp, .45, 1.5 + Math.random() * 2);
    }
    b.dents.push({ x, y, t0: t });
    if (b.dents.length > 16) b.dents.shift();
  }

  function restCoin(b, k, t) {
    const Rc = tex.Rc, T = tex.T, hw = .9 * Rc;
    let x = Math.max(hw, Math.min(W - hw, k.x));
    let hl = heapAt(b, x - hw * .8), hr = heapAt(b, x + hw * .8);
    let slope = (hr - hl) / (1.6 * hw);
    if (Math.abs(slope) > .35) {
      // te steil: een halve munt naar beneden glijden (natuurlijke stortkegel)
      x = Math.max(hw, Math.min(W - hw, x + (slope > 0 ? -1 : 1) * .5 * Rc));
      hl = heapAt(b, x - hw * .8); hr = heapAt(b, x + hw * .8);
      slope = (hr - hl) / (1.6 * hw);
    }
    const lying = Math.random() < .7;
    const tilt = (lying ? 72 + Math.random() * 12 : 40 + Math.random() * 20) * DEG;
    const phi = (Math.random() < .5 ? tilt : Math.PI - tilt) + (Math.random() < .5 ? 0 : Math.PI);
    const rot = Math.max(-20 * DEG, Math.min(20 * DEG, -Math.atan(slope))) + (Math.random() - .5) * .1;
    const ry = Rc * Math.abs(Math.cos(tilt));
    const base = Math.min(H * .42, .5 * heapMax(b, x, hw) + .5 * heapMean(b, x, hw));
    const y = H - base - (ry + T / 2) * .85;
    const h = T + 1.1 * ry + 2.5;
    const i0 = Math.max(0, Math.floor((x - hw) / BIN)), i1 = Math.min(b.heap.length - 1, Math.floor((x + hw) / BIN));
    for (let i = i0; i <= i1; i++) {
      const dx = ((i + .5) * BIN - x) / hw;
      if (Math.abs(dx) > 1) continue;
      const prof = Math.sqrt(1 - dx * dx);
      b.heap[i] = Math.min(H * .42, Math.max(b.heap[i], base + h * (.4 + .6 * prof)));
    }
    // in de stapel stempelen: schaduw, dan de munt (zo kosten liggende munten niets meer)
    const pc = tex.pileCtx, cs = tex.cs, half = cs / 2 / DPR;
    pc.setTransform(DPR, 0, 0, DPR, 0, -tex.pileY * DPR);
    pc.globalAlpha = .55;
    pc.drawImage(tex.shadow, x - 1.15 * Rc, y + ry * .3 - .2 * Rc + T, 2.3 * Rc, .75 * Rc);
    pc.globalAlpha = 1;
    pc.translate(x, y);
    pc.rotate(rot);
    const fi = frameOf(phi);
    pc.drawImage(tex.coin, (fi % 8) * cs, (Math.floor(fi / 8) + 3) * cs, cs, cs, -half, -half, half * 2, half * 2);
    b.pileUsed = true;
    b.shimmer.push({ x: x - Rc * .35, y: y - ry * .5 });
    if (b.shimmer.length > 60) b.shimmer.shift();
  }

  function stepCoins(b, t, dt, geo) {
    while (b.next < b.coins.length && b.coins[b.next].t0 <= t && b.active.length < 34) {
      const k = b.coins[b.next++];
      k.st = 1;
      b.active.push(k);
    }
    b.acc += dt;
    let steps = 0;
    const h = 1 / 120;
    while (b.acc >= h && steps < 12) { physics(b, h, geo, t); b.acc -= h; steps++; }
    if (steps >= 12) b.acc = 0;
    // spatjes en belletjes
    const f = b.fx;
    for (let i = 0; i < FXN; i++) {
      if (f.life[i] <= 0) continue;
      f.life[i] -= dt;
      if (f.kind[i] === 0) { f.vy[i] += G * dt; f.x[i] += f.vx[i] * dt; f.y[i] += f.vy[i] * dt; }
      else { f.y[i] -= 60 * dt; f.x[i] += Math.sin(f.y[i] * .1) * 6 * dt; }
    }
  }

  function physics(b, h, geo, t) {
    const Rc = tex.Rc;
    for (let i = b.active.length - 1; i >= 0; i--) {
      const k = b.active[i];
      if (k.st === 1) {
        k.vy += G * h;
        const top = topAt(geo, k.x);
        if (k.y + Rc * .3 >= top) { k.st = 2; k.vy *= .35; splash(b, k.x, top, t); }
      } else if (k.st === 2) {
        k.vy = k.vy * Math.exp(-7 * h) + G * h;
        if (k.y - Rc * .3 > botAt(geo, k.x)) k.st = 3;
      } else {
        k.vy += (680 - k.vy) * (1 - Math.exp(-4 * h));
        k.w = Math.sign(k.w) * Math.max(2, Math.abs(k.w) * Math.exp(-2 * h));
        k.trail -= h;
        if (k.trail <= 0) { k.trail = .05; emit(b, 1, k.x + (Math.random() - .5) * Rc, k.y - Rc * .4, 0, 0, .6, .8 + Math.random() * .6); }
      }
      k.y += k.vy * h;
      k.x += k.vx * h;
      k.vx *= Math.exp(-2 * h);
      k.x = Math.max(Rc * .6, Math.min(W - Rc * .6, k.x));
      k.phi += k.w * h * (k.st === 3 ? .6 : 1);
      k.rot += k.wr * h * (k.st === 3 ? .3 : 1);
      if (k.st >= 2) {
        const floor = H - heapMax(b, k.x, .9 * Rc);
        if (k.y + Rc * .5 >= floor) {
          if (!k.bounced && k.vy > 150) { k.bounced = true; k.vy = -.25 * k.vy; k.y = floor - Rc * .5; }
          else { restCoin(b, k, t); b.active.splice(i, 1); }
        }
      }
    }
  }

  function drawCoin(c, k, wet, alpha, t) {
    const cs = tex.cs, half = cs / 2 / DPR;
    const fi = frameOf(k.phi);
    const sx = (fi % 8) * cs, sy = Math.floor(fi / 8) * cs;
    const wob = k.st === 3 ? 10 * Math.sin(7 * t + k.seed) : 0;   // vallend blad
    c.save();
    c.translate(k.x + wob, k.y);
    c.rotate(k.rot + (k.st === 3 ? .35 * Math.sin(7 * t + k.seed + 1) : 0));
    c.globalAlpha = alpha;
    c.drawImage(tex.coin, sx, sy, cs, cs, -half, -half, half * 2, half * 2);
    if (wet > 0) {
      c.globalAlpha = alpha * wet;
      c.drawImage(tex.coin, sx, sy + 3 * cs, cs, cs, -half, -half, half * 2, half * 2);
    }
    c.restore();
  }

  // Schuimkraag (bord-canvas, volle resolutie)
  const HN = 24;
  const hTop = new Float32Array(HN + 1), hBot = new Float32Array(HN + 1);
  function drawHead(c, b, geo, u, t) {
    const fa = c.globalAlpha;   // = fade
    let minTop = Infinity, maxBot = 0;
    for (let i = 0; i <= HN; i++) {
      const x = i / HN * W;
      hTop[i] = topAt(geo, x);
      hBot[i] = Math.max(botAt(geo, x), hTop[i] + 6);
      if (hTop[i] < minTop) minTop = hTop[i];
      if (hBot[i] > maxBot) maxBot = hBot[i];
    }
    if (minTop > H) return;
    c.save();
    c.beginPath();
    c.moveTo(0, hTop[0]);
    for (let i = 1; i <= HN; i++) c.lineTo(i / HN * W, hTop[i]);
    for (let i = HN; i >= 0; i--) c.lineTo(i / HN * W, hBot[i]);
    c.closePath();
    c.clip();
    const fw = tex.foam.width / DPR, fh = tex.foam.height / DPR;
    const y0 = minTop - 4;
    for (let x = 0; x < W; x += fw) {
      c.drawImage(tex.foam, x, y0, fw, fh);
      if (y0 + fh < maxBot) c.drawImage(tex.foam, x, y0 + fh, fw, fh);
    }
    if (geo.tan > .005) {
      c.globalAlpha = geo.tan;
      c.fillStyle = '#b8936e';
      c.fillRect(0, y0, W, maxBot - y0 + 2);
    }
    // glasronding: iets donkerder langs de wand
    c.globalAlpha = fa;
    c.fillStyle = tex.vigL; c.fillRect(0, y0, 12, maxBot - y0 + 2);
    c.fillStyle = tex.vigR; c.fillRect(W - 12, y0, 12, maxBot - y0 + 2);
    // plekjes waar een munt erdoor ging: een kort, lichter kratertje met een kringetje
    for (let i = 0; i < b.dents.length; i++) {
      const d = b.dents[i];
      const a = (t - d.t0) / .7;
      if (a >= 1 || a < 0) continue;
      const Rc = tex.Rc;
      const sh = 1 - a * .4;
      c.globalAlpha = .14 * (1 - a);
      c.fillStyle = '#c9b08c';
      c.beginPath(); c.ellipse(d.x, d.y + 4, 1.05 * Rc * sh, .3 * Rc * sh, 0, 0, TAU); c.fill();
      c.globalAlpha = .55 * (1 - a);
      c.strokeStyle = '#fffaf0';
      c.lineWidth = 1;
      c.beginPath(); c.ellipse(d.x, d.y + 3, 1.2 * Rc * sh, .38 * Rc * sh, 0, 0, TAU); c.stroke();
      const ra = clamp((t - d.t0) / .4);
      if (ra < 1) {
        c.globalAlpha = .4 * (1 - ra);
        c.strokeStyle = '#fbf6ea';
        c.lineWidth = 1.2;
        c.beginPath(); c.ellipse(d.x, d.y + 3, 3 * Rc * ra + 1, Rc * ra * .45 + .5, 0, 0, TAU); c.stroke();
      }
    }
    // af en toe knapt er een belletje
    if (!reduced && u > 3 && u < QUIET_U) {
      if (t > b.nextPop) {
        b.pops.push({ x: Math.random() * W, y: geo.topY + 6 + Math.random() * geo.th * .7, t0: t });
        b.nextPop = t + 1.5 + Math.random();
        if (b.pops.length > 4) b.pops.shift();
      }
      c.fillStyle = '#b39c7e';
      b.pops.forEach(p => {
        const a = (t - p.t0) / .3;
        if (a < 0 || a >= 1) return;
        c.globalAlpha = .35 * (1 - a);
        c.beginPath(); c.arc(p.x, p.y, 1.2 + a, 0, TAU); c.fill();
      });
    }
    c.restore();
    // overgang naar het bier, langs de golvende onderrand
    // smalle plakjes (3 px, op hele schermpixels), zodat er geen naden ontstaan
    c.globalAlpha = fa;
    const sc = 1 + .3 * (1 - smooth(1.2, 3.6, u));
    const ns = Math.min(1023, Math.ceil(W / 3)), sw = W / ns;
    for (let i = 0; i < ns; i++) {
      const x0 = Math.round(i * sw * DPR) / DPR, x1 = Math.round((i + 1) * sw * DPR) / DPR;
      const yb = botAt(geo, (x0 + x1) / 2);
      c.drawImage(tex.iface, x0, yb - 4 * sc, x1 - x0, 10 * sc);
    }
    // een paar fijne belletjes die net onder de kraag hangen
    if (u > 2.5) {
      c.globalAlpha = fa * .32 * smooth(2.5, 3.5, u);
      for (let i = 0; i < b.hang.length; i++) {
        const h = b.hang[i];
        c.drawImage(tex.dot, h.x - h.r, botAt(geo, h.x) + 4 + h.dy - h.r, h.r * 2, h.r * 2);
      }
      c.globalAlpha = fa;
    }
    // meniscus / glanslijn bovenop
    c.beginPath();
    c.moveTo(0, hTop[0]);
    for (let i = 1; i <= HN; i++) c.lineTo(i / HN * W, hTop[i]);
    c.lineWidth = 1.5;
    c.strokeStyle = `rgba(255,253,247,${geo.hl.toFixed(3)})`;
    c.stroke();
  }

  function drawPour(now, dt, raw) {
    const b = beer;
    const age = now - b.at;
    let t = age / 1000;
    if (b.instant) t = Math.max(t, END_U * K + .2);
    const u = t / K;
    const geo = pourGeo(u, t);
    b.geo = geo;

    // Houdt het toestel het niet bij? Mediaan van de beeldtijden tijdens het schenken, vergeleken met de
    // basislijn van dit toestel (zelfde rAF-limiet, bv. 30 Hz in energiebesparing). Uitschieters tellen niet.
    // Is het te zwaar, dan vervagen de optionele lagen in 0,3 s; de resolutie wijzigt pas bij het volgende glas.
    const q = b.q;
    if (!q.done) {
      q.f++;
      if (q.f > 6) q.s[q.n++] = Math.min(raw, .05);
      if (q.n >= q.s.length) {
        q.done = true;
        const med = median(q.s, q.n);
        if (med > Math.max(q.base * 1.3, .0185)) {
          if (!lowQ) { lowQ = true; b.qAt = t; }
        } else if (lowQ && med <= q.base * 1.08) {
          lowQ = false;                                     // ruim genoeg over: volgende glas weer vol
        }
      }
    }
    if (b.qAt >= 0) b.qm = 1 - clamp((t - b.qAt) / .3);

    drawLiquid(b, u, t, dt, geo, age);
    stepCoins(b, t, dt, geo);

    const c = ctx;
    const fade = reduced ? clamp(age / 400) : 1;
    const Rc = tex.Rc;
    if (fade !== b.pileOp) { b.pileOp = fade; pileCv.style.opacity = fade >= 1 ? '' : String(fade); }
    particles(c, b, u, t, dt);
    c.globalAlpha = fade;
    // munten onder de kraag (in het bier)
    const hb = geo.topY + geo.th;
    for (let i = 0; i < b.active.length; i++) {
      const k = b.active[i];
      if (k.st === 3) drawCoin(c, k, clamp((k.y - hb) / 60), fade, t);
    }
    // belletjes achter de munten aan
    const f = b.fx;
    for (let i = 0; i < FXN; i++) {
      if (f.life[i] <= 0 || f.kind[i] !== 1) continue;
      c.globalAlpha = .45 * (f.life[i] / f.max[i]);
      const r = f.r[i];
      c.drawImage(tex.dot, f.x[i] - r, f.y[i] - r, r * 2, r * 2);
    }
    c.globalAlpha = fade;
    drawHead(c, b, geo, u, t);
    // munten die door het schuim zakken: half verstopt
    for (let i = 0; i < b.active.length; i++) {
      const k = b.active[i];
      if (k.st === 2) drawCoin(c, k, 0, .42 * fade, t);
    }
    // munten in de lucht
    for (let i = 0; i < b.active.length; i++) {
      const k = b.active[i];
      if (k.st === 1) drawCoin(c, k, 0, fade, t);
    }
    // spatjes schuim
    for (let i = 0; i < FXN; i++) {
      if (f.life[i] <= 0 || f.kind[i] !== 0) continue;
      c.globalAlpha = Math.min(1, 1.6 * f.life[i] / f.max[i]);
      const r = f.r[i];
      c.drawImage(tex.dot, f.x[i] - r, f.y[i] - r, r * 2, r * 2);
    }
    // glans: alleen munten in de lucht vangen het licht; op de stapel heel af en toe, en daarna rust
    if (!reduced) {
      for (let i = 0; i < b.active.length; i++) {
        const k = b.active[i];
        if (k.st === 1 && Math.cos(k.phi - .6) > .97 && t - k.spark > .25) {
          k.spark = t;
          b.sp.push({ x: k.x - Rc * .55, y: k.y - Rc * .35 * Math.abs(Math.cos(k.phi)), t0: t, life: .25, s: .6 + Math.random() * .4, back: false });
        }
      }
      if (b.shimmer.length && t > b.nextShimmer && u < QUIET_U) {
        const p = b.shimmer[Math.floor(Math.random() * b.shimmer.length)];
        b.sp.push({ x: p.x, y: p.y, t0: t, life: .35, s: .6 + Math.random() * .4, back: true });
        b.nextShimmer = t + 1.8 + Math.random() * 1.2;
      }
      c.globalCompositeOperation = 'lighter';
      for (let i = b.sp.length - 1; i >= 0; i--) {
        const s = b.sp[i];
        const a = (t - s.t0) / s.life;
        if (a >= 1 || a < 0) { b.sp.splice(i, 1); continue; }
        const env = Math.sin(Math.PI * a);
        const sc = s.back ? easeOutBack(clamp(a * 1.6)) * (1 - a * .4) : .6 + .4 * env;
        const size = 10 * s.s * sc;
        c.globalAlpha = .8 * env;
        c.drawImage(tex.spark, s.x - size / 2, s.y - size / 2, size, size);
      }
      c.globalCompositeOperation = 'source-over';
    }
    c.globalAlpha = 1;
    // Alles staat stil: het bord nog één keer zo laten staan en daarna niet meer hertekenen.
    if (b.liquidDone && !b.active.length && b.next >= b.coins.length && !b.sp.length &&
        (reduced ? age > 420 : u > FREEZE_U) && !fxAlive(b)) b.frozen = true;
  }
  function fxAlive(b) {
    const l = b.fx.life;
    for (let i = 0; i < FXN; i++) if (l[i] > 0) return true;
    return false;
  }

  function winnerClover(now) {
    const age = now - winner.at;
    const { x, y } = winner;
    if (!reduced) {
      mctx.strokeStyle = GOLD.light;
      for (let i = 0; i < 3; i++) {
        const p = (age / 1800 + i / 3) % 1;
        mctx.globalAlpha = (1 - p) * .4;
        mctx.lineWidth = 2;
        mctx.beginPath(); mctx.arc(x, y, R * (1.35 + p * 2.4), 0, TAU); mctx.stroke();
      }
      mctx.globalAlpha = 1;
    }
    const pop = reduced ? 1 : easeOutBack(clamp(age / 420));
    const pulse = reduced ? 1 : 1 + .05 * Math.sin(age / 200);
    const sway = reduced ? 0 : .07 * Math.sin(age / 520);
    clover(x, y, GOLD, (.9 + .25 * pop) * pulse, 1, winner.num, winner.rot + sway);
  }

  function splitClovers(now) {
    const age = now - split.at;
    split.members.forEach((m, i) => {
      const pop = reduced ? 1 : easeOutBack(clamp(age / 380));
      const pulse = reduced ? 1 : 1 + .035 * Math.sin(age / 190 + i);
      clover(m.x, m.y, TEAMS[m.team], (.85 + .25 * pop) * pulse, 1, m.num, m.rot, TEAMS[m.team]);
    });
  }

  let lastFrame = performance.now();
  let markBox = null;          // wat er vorig beeldje op de klavertjeslaag stond (null = alles wissen)
  function frame() {
    const now = performance.now();
    const raw = (now - lastFrame) / 1000;
    lastFrame = now;
    const dt = Math.min(.05, raw);
    const wait = mode === 'tap' ? TAP_MS : HOLD_MS;
    const need = needPlayers();
    if (phase === 'gather' && fingers.size >= need && now - lastChange >= wait) startShuffle(now);
    if (phase === 'shuffle') stepShuffle(now);
    if ((phase === 'gather' || phase === 'shuffle') && !document.hidden) noteBaseline(raw);

    // Staat het glas stil, dan blijft het bord zoals het is (geen 3x-canvas per beeldje wissen en hertekenen).
    const frozen = !!(winner && beer && beer.frozen);
    if (!frozen) {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, W, H);
    }
    mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    mctx.globalAlpha = 1;
    if (markBox) mctx.clearRect(markBox[0], markBox[1], markBox[2], markBox[3]);
    else mctx.clearRect(0, 0, W, H);
    markBox = null;

    if (winner) {
      if (beer && !frozen) {
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        drawPour(now, dt, raw);
      }
    } else {
      drawAmbient(now / 1000, dt);
      if (split) drawSplitBoard(now);
    }

    ghosts = ghosts.filter(g => now - g.t0 < 240);
    ghosts.forEach(g => { const k = (now - g.t0) / 240; clover(g.x, g.y, g.paint, 1 - k * .5, 1 - k, g.label, g.rot - k); });

    if (winner) {
      const fade = reduced ? 0 : clamp(1 - (now - winner.at) / 300);
      if (fade > 0) fingers.forEach(f => { if (f.id !== winner.id) clover(f.x, f.y, SHAMROCK, .6 + .4 * fade, fade, f.num, f.rot); });
      winnerClover(now);
      // Alleen het gouden klavertje (met ringen) leeft nog: volgend beeldje alleen dat stukje wissen.
      if (fade <= 0 && !ghosts.length) {
        const r = R * 3.9 + 8;
        markBox = [winner.x - r, winner.y - r, r * 2, r * 2];
      }
    } else if (split) {
      splitClovers(now);
    } else {
      const counting = phase === 'gather' && fingers.size >= need;
      const p = clamp((now - lastChange) / wait);
      fingers.forEach(f => {
        const grow = clamp((now - f.born) / 360);
        let s = reduced ? 1 : easeOutBack(grow) * (1 + .04 * Math.sin((now - f.born) / 170));
        const rot = reduced ? f.rot : f.rot - (1 - easeInOutCubic(grow)) * 1.4 + .06 * Math.sin((now - f.born) / 600);
        let a = 1;
        let paint = paintFor();
        let team = null;
        if (phase === 'shuffle') {
          if (teamCount) {
            if (shuffle.tint.has(f.id)) { paint = TEAMS[shuffle.tint.get(f.id)]; team = paint; }
          } else if (shuffle.hi != null) {
            if (f.id === shuffle.hi) { s *= 1.2; paint = GOLD; }
            else { s *= .88; a = .35; }
          }
        }
        clover(f.x, f.y, paint, s, a, f.num, rot, team);
        if (counting) countdown(f.x, f.y, R * s * 1.62, p);
      });
    }
    requestAnimationFrame(frame);
  }

  // Voorbeeldronde zonder touchscreen: open de pagina met #demo
  if (location.hash === '#demo') {
    setTimeout(() => {
      const now = performance.now();
      [[.26, .28], [.72, .2], [.5, .47], [.2, .7], [.8, .64], [.54, .84]]
        .forEach((p, i) => addFinger(9000 + i, p[0] * W, p[1] * H, now));
      syncUI();
    }, 400);
  }

  resize();
  syncUI();
  requestAnimationFrame(frame);
  // Zware texturen alvast in rustige momenten opbouwen, zodat het schenken meteen vloeiend is.
  setTimeout(() => {
    ensureStatic();
    setTimeout(() => { if (!winner) ensureSized(); }, 60);
  }, 500);
  try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => placeThumb(true)); } catch (_) {}
})();
</script>
</body>
</html>
